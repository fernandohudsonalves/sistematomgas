<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Tom Gás</title>
<link rel="icon" id="favicon-link" href="data:,">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<meta name="theme-color" content="#1E3A8A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tom Gás">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --royal:#1E3A8A;
  --royal-dark:#142A63;
  --royal-light:#3B5FC4;
  --blue-light:#5BA3F5;
  --blue-tint:#EAF2FE;
  --green:#16A34A;
  --green-tint:#E7F7ED;
  --neon:#B6FF3D;
  --bg:#F3F6FB;
  --card:#FFFFFF;
  --text:#10203E;
  --text2:#5B6B85;
  --text3:#94A2B8;
  --border:#E1E7F0;
  --danger:#DC2626;
  --danger-tint:#FDECEC;
  --amber:#B45309;
  --amber-tint:#FEF3E2;
  --purple:#7C3AED;
  --purple-tint:#F1EAFE;
  --radius:12px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
#app{min-height:100vh;display:flex;flex-direction:column;}

header{background:var(--royal);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(20,42,99,.25);gap:14px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--neon);flex-shrink:0;}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;}
#logo-box{display:flex;align-items:center;gap:8px;}

nav{background:var(--royal-dark);display:block;overflow-x:auto;position:sticky;top:53px;z-index:19;}
#nav-principal,#subnav{display:flex;}
nav button{flex:1;min-width:88px;background:none;border:none;color:#C6D4F5;padding:12px 8px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
nav button.active{color:#fff;border-bottom-color:var(--neon);background:rgba(255,255,255,.06);}
nav button:hover{color:#fff;}
.nav-sep{color:rgba(255,255,255,.3);display:flex;align-items:center;font-size:14px;flex-shrink:0;}

main{flex:1;padding:18px;max-width:980px;width:100%;margin:0 auto;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
.card h2{font-size:15px;margin:0 0 14px;color:var(--royal);font-weight:700;}
.card h3{font-size:13px;margin:18px 0 8px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.grid{display:grid;gap:12px;}
.grid.cols2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.grid.cols4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}

.metric{background:var(--blue-tint);border-radius:var(--radius);padding:14px 16px;border-left:4px solid var(--royal);}
.metric.metric-link{cursor:pointer;transition:filter .15s,transform .1s;}
.metric.metric-link:hover{filter:brightness(0.96);}
.metric.metric-link:active{transform:scale(0.98);}
.metric.pos{background:var(--green-tint);border-left-color:var(--green);}
.metric.neg{background:var(--danger-tint);border-left-color:var(--danger);}
.metric .label{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.metric .value{font-size:22px;font-weight:700;margin-top:4px;color:var(--royal);}
.metric.pos .value{color:var(--green);}
.metric.neg .value{color:var(--danger);}

label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin:10px 0 4px;}
.req{color:var(--danger);font-weight:700;}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--royal-light);box-shadow:0 0 0 3px var(--blue-tint);}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.qty-stepper{display:flex;align-items:stretch;}
.qty-stepper input[type=number]{-moz-appearance:textfield;text-align:center;border-radius:0;border-left:none;border-right:none;position:relative;z-index:1;}
.qty-stepper input[type=number]::-webkit-outer-spin-button,.qty-stepper input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.qty-btn{width:38px;flex-shrink:0;border:1px solid var(--border);background:var(--blue-tint);color:var(--royal);font-size:18px;font-weight:700;cursor:pointer;line-height:1;padding:0;}
.qty-btn:first-child{border-radius:8px 0 0 8px;}
.qty-btn:last-child{border-radius:0 8px 8px 0;}
.qty-btn:active{background:var(--royal-light);color:#fff;}
button.btn{background:var(--royal);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px;}
button.btn:hover{background:var(--royal-light);}
button.btn.green{background:var(--green);}
button.btn.green:hover{background:#128a3e;}
button.btn.ghost{background:none;color:var(--royal);border:1px solid var(--royal);}
button.btn.small{padding:6px 12px;font-size:12px;margin-top:0;}
.inline-add{display:flex;gap:8px;align-items:flex-end;margin-top:8px;}
.inline-add input{flex:1;}
.inline-add button{margin-top:0;white-space:nowrap;}
.link-btn{background:none;border:none;color:var(--royal-light);font-size:12px;font-weight:600;cursor:pointer;padding:0;margin-top:6px;transition:opacity .15s;}
.link-btn:hover{opacity:.7;text-decoration:underline;}
#logo-box img{cursor:pointer;transition:opacity .15s;}
#logo-box img:hover{opacity:.8;}

.table-wrap{overflow-x:auto;}
.table-wrap table{width:100%;table-layout:fixed;border-collapse:collapse;}
.table-wrap th,.table-wrap td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;padding:6px 8px;font-size:12.5px;}
.table-wrap td.cel-acoes{overflow:visible;max-width:none;white-space:nowrap;}
.table-wrap td .badge,.table-wrap td .pill{white-space:nowrap;}
.table-wrap td button{font-size:11.5px;padding:2px 4px;}
.ajuda-btn{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:#f0ad00;color:#fff;border:none;font-weight:bold;font-size:12px;cursor:pointer;margin-left:6px;vertical-align:middle;padding:0;line-height:1;}
.ajuda-conteudo{background:#fff8e6;border:1px solid #f0ad00;border-radius:8px;padding:10px 12px;margin:8px 0 4px;font-size:12.5px;line-height:1.5;color:#333;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase;padding:8px 6px;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:9px 6px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge.gas{background:var(--blue-tint);color:var(--royal);}
.badge.agua{background:var(--green-tint);color:var(--green);}
.badge.outro{background:#EFEAFB;color:#5B3DBF;}
.badge.fiado{background:var(--amber-tint);color:var(--amber);}
.badge.pago{background:var(--green-tint);color:var(--green);}
.badge.nota{background:var(--blue-tint);color:var(--royal-dark);}
.badge.status-pago{background:var(--green-tint);color:var(--green);}
.badge.status-receber{background:var(--amber-tint);color:var(--amber);font-weight:700;}
.empty{color:var(--text3);font-size:13px;padding:14px 0;text-align:center;}
.del-link{display:inline-flex;align-items:center;gap:4px;color:var(--danger);background:#FEE2E2;cursor:pointer;font-size:12px;font-weight:600;border:none;padding:5px 9px;border-radius:7px;margin:2px 4px 2px 0;white-space:nowrap;}
.act-link{display:inline-flex;align-items:center;gap:4px;color:var(--royal);background:var(--blue-tint);cursor:pointer;font-size:12px;font-weight:600;border:none;padding:5px 9px;border-radius:7px;margin:2px 4px 2px 0;white-space:nowrap;}
.act-link:hover, .del-link:hover{filter:brightness(0.95);}
table td:last-child{min-width:180px;}

.stock-box{background:var(--blue-tint);border-radius:var(--radius);padding:12px;text-align:center;}
.meta-card{background:linear-gradient(135deg,var(--royal) 0%,var(--royal-dark) 100%);border-radius:var(--radius);padding:18px 20px;color:#fff;margin-bottom:16px;}
.carrinho-total-badge{display:block;margin-top:12px;padding:14px 18px;background:linear-gradient(135deg,var(--green) 0%,#0d7a37 100%);color:#fff;border-radius:var(--radius);font-size:16px;font-weight:800;text-align:center;letter-spacing:.2px;box-shadow:0 4px 14px rgba(22,163,74,.35);}
.meta-card h2{color:#fff;margin-top:0;}
.meta-block{margin-top:14px;}
.meta-block:first-of-type{margin-top:6px;}
.meta-block .meta-label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:6px;}
.meta-block .meta-pct{font-weight:700;}
.meta-bar-track{width:100%;height:20px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;}
.meta-bar-fill{height:100%;background:var(--neon);border-radius:999px;transition:width .4s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;box-sizing:border-box;min-width:28px;}
.meta-bar-fill.completa{background:var(--green);}
.meta-bar-fill .meta-bar-txt{font-size:11px;font-weight:700;color:var(--royal-dark);white-space:nowrap;}
.meta-bar-fill.completa .meta-bar-txt{color:#fff;}
.meta-sem-config{background:rgba(255,255,255,.14);border-radius:var(--radius);padding:12px 14px;font-size:13px;}
.meta-sem-config a, .meta-sem-config button.link-btn{color:#fff;text-decoration:underline;}
.nota-ok{background:rgba(182,255,61,.18);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--neon);}
.nota-baixa{background:rgba(255,209,102,.18);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;color:#FFD166;}
.card-link{cursor:pointer;transition:filter .15s,transform .1s;}
.card-link:hover{filter:brightness(0.97);}
.card-link:active{transform:scale(0.995);}
.stock-box.agua{background:var(--green-tint);}
.stock-box.dfonte{background:var(--purple-tint);}
.stock-box .n{font-size:22px;font-weight:700;color:var(--royal);}
.stock-box.agua .n{color:var(--green);}
.stock-box.dfonte .n{color:var(--purple);}
.stock-box .l{font-size:11px;color:var(--text2);margin-top:2px;}
.badge.dfonte{background:var(--purple-tint);color:var(--purple);}
.chart-box{position:relative;height:250px;}
.chart-card h3{margin-top:0;}

.csv-preview{overflow-x:auto;margin-top:10px;}
.mapping-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mapping-row span{width:120px;font-size:13px;font-weight:600;flex-shrink:0;}
.pill{display:inline-block;background:var(--blue-tint);color:var(--royal);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;margin-left:6px;}
.searchbar{margin-bottom:12px;}
.hint{font-size:12px;color:var(--text3);margin-top:4px;}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.checklist-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.checklist-lista{margin-top:8px;display:flex;flex-direction:column;gap:3px;}
.checklist-item{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;padding:4px 8px;border-radius:6px;background:var(--blue-tint);overflow:hidden;}
.checklist-item.feito{background:var(--green-tint);}
.checklist-texto{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.checklist-meta{font-size:11px;color:var(--text2);white-space:nowrap;flex-shrink:0;}
.check-ok{color:var(--green);font-weight:800;}
.riscado{text-decoration:line-through;color:var(--text2);}
.checklist-select-func{max-width:130px;font-size:12px;padding:2px 4px;flex-shrink:0;}
.checklist-acoes{display:flex;gap:3px;flex-wrap:nowrap;flex-shrink:0;}
.checklist-acoes button{font-size:11px;}
.item-venda-row{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;background:#F8FAFC;}
.item-venda-row .form-row{align-items:end;}
.cat-checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px;max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:12px;}
.checkbox-item{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;width:100%;}
.checkbox-item input{width:auto;}
.comunicado-banner{background:linear-gradient(135deg,var(--royal) 0%,var(--royal-dark) 100%);color:#fff;border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden;}
.comunicado-banner img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:10px;}
.comunicado-banner h3{margin:0 0 4px;font-size:15px;color:#fff;}
.comunicado-banner p{margin:0;font-size:13px;color:#E4EAFB;white-space:pre-wrap;}
.comunicado-banner .tag{display:inline-block;background:var(--neon);color:var(--royal-dark);font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-bottom:8px;}
@media print{
  body *{ visibility:hidden; }
  #extrato-imprimir, #extrato-imprimir *{ visibility:visible; }
  #extrato-imprimir{ position:absolute; left:0; top:0; width:100%; box-shadow:none; border:none; }
  .no-print{ display:none !important; }
}
.cap-bar-wrap{margin:14px 0;}
.cap-bar{position:relative;display:flex;width:100%;height:48px;background:repeating-linear-gradient(45deg,#F1F5F9 0 10px,#EAF0F6 10px 20px);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.cap-lado{display:flex;height:100%;}
.cap-lado.vazio{margin-left:auto;}
.cap-seg{height:100%;flex-shrink:0;}
.cap-lado.vazio .cap-seg{opacity:.5;background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.4) 0 4px, transparent 4px 8px);}
.cap-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text2);align-items:center;}
.cap-legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle;}
.subtabs button{background:var(--blue-tint);color:var(--royal);border:none;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;}
.subtabs button.active{background:var(--royal);color:#fff;}
.camp-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:-2px 0 14px;}
.camp-head p{margin:0;color:var(--text3);font-size:12px;}
.lc-grid{display:grid;gap:10px;}
.lc-card{background:linear-gradient(180deg,#fff 0%,var(--blue-tint) 130%);border:1px solid var(--border);border-radius:12px;padding:13px 15px;transition:box-shadow .15s,transform .1s;}
.lc-card:hover{box-shadow:0 4px 14px rgba(30,58,138,.1);}
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.lc-top strong{font-size:14px;color:var(--royal-dark);}
.lc-msg{font-size:12.5px;color:var(--text2);margin:7px 0;line-height:1.4;}
.lc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--text3);}
.lc-acoes{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
.badge.roxo{background:var(--purple-tint);color:var(--purple);}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--royal) 0%,var(--royal-dark) 100%);padding:20px;}
.auth-card{background:#fff;border-radius:16px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);}
.auth-card .dot{width:10px;height:10px;border-radius:50%;background:var(--neon);display:inline-block;margin-right:8px;}
.auth-card h1{font-size:19px;color:var(--royal);margin:0 0 4px;}
.auth-card .sub{font-size:13px;color:var(--text2);margin-bottom:20px;}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--bg);border-radius:10px;padding:4px;}
.auth-tabs button{flex:1;background:none;border:none;padding:8px;border-radius:8px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;}
.auth-tabs button.active{background:var(--royal);color:#fff;}
.auth-msg{font-size:12px;padding:10px 12px;border-radius:8px;margin-top:12px;}
.auth-msg.ok{background:var(--green-tint);color:var(--green);}
.auth-msg.err{background:var(--danger-tint);color:var(--danger);}
.auth-form{display:none;}
.auth-form.active{display:block;}
#agenda-fab{position:fixed;bottom:20px;right:20px;z-index:500;background:#142A63;color:#fff;border:none;border-radius:24px;padding:12px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;}
#agenda-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:600;display:none;}
#agenda-drawer{position:fixed;top:0;right:-380px;width:360px;max-width:90vw;height:100%;background:#fff;z-index:601;box-shadow:-4px 0 20px rgba(0,0,0,.2);padding:14px;overflow-y:auto;overflow-x:hidden;transition:right .25s;}
#agenda-drawer.open{right:0;}
#agenda-overlay.open{display:block;}
.ag-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ag-head button{width:auto;background:none;border:none;font-size:16px;cursor:pointer;}
.ag-item{border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:11.5px;overflow:hidden;word-break:break-word;}
.ag-item .ag-titulo{font-weight:700;font-size:12px;}
.ag-item .ag-meta{color:#666;font-size:10.5px;margin:2px 0;white-space:normal;}
.ag-item .ag-acoes button{width:auto;font-size:11px;margin-right:6px;background:none;border:none;color:#1E3A8A;cursor:pointer;padding:0;}
#checklist-hover-drawer{position:fixed;left:0;top:110px;width:300px;max-height:calc(100vh - 140px);background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.99));backdrop-filter:blur(10px);border:1px solid rgba(30,58,138,.08);border-left:none;box-shadow:0 16px 40px rgba(16,32,62,.18);border-radius:0 18px 18px 0;transform:translateX(calc(-100% + 6px));transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:9998;overflow:hidden;display:flex;flex-direction:column;}
#checklist-hover-drawer:hover,#checklist-hover-drawer.open{transform:translateX(0);}
#checklist-hover-tab{position:absolute;right:-42px;top:20px;background:linear-gradient(135deg,var(--royal-light),var(--royal));color:#fff;padding:12px 10px;border-radius:0 12px 12px 0;writing-mode:vertical-rl;font-weight:700;font-size:12px;letter-spacing:.4px;box-shadow:3px 4px 14px rgba(20,42,99,.35);display:flex;align-items:center;gap:7px;}
#checklist-hover-tab .chk-tab-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);flex-shrink:0;}
#checklist-hover-tab .chk-tab-dot.done{background:var(--neon);box-shadow:0 0 6px rgba(182,255,61,.9);}
#checklist-hover-content{padding:16px 14px 18px;overflow-y:auto;}
#checklist-hover-content h3{margin:0 0 4px;font-size:14px;color:var(--royal);font-weight:800;display:flex;align-items:center;gap:6px;}
.chk-drawer-sub{font-size:11px;color:var(--text3);margin:0 0 12px;}
.chk-progress-track{height:6px;border-radius:999px;background:var(--blue-tint);overflow:hidden;margin-bottom:14px;}
.chk-progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--royal-light),var(--green));transition:width .3s ease;}
.chk-drawer-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;margin-bottom:5px;transition:background .15s;cursor:pointer;}
.chk-drawer-item:hover{background:var(--blue-tint);}
.chk-drawer-item:active{background:var(--border);}

function renderChecklistHoverDrawer(){
  const e=document.getElementById('checklist-hover-content');if(!e)return;
  const d=diaChecklist(todayStr());
  const a=state.checklistRotina.map(x=>({id:x.id,text:x.texto})).concat((d.extras||[]).map(x=>({id:x.id,text:x.texto})));
  const feitos=a.filter(x=>d.marcacoes[x.id]).length;
  const pct=a.length?Math.round(feitos/a.length*100):0;
  const dot=document.getElementById('chk-tab-dot'); if(dot) dot.classList.toggle('done', a.length>0 && feitos===a.length);
  e.innerHTML='<h3>☑ Checklist de hoje</h3><div class="chk-drawer-sub">'+feitos+' de '+a.length+' concluídas</div>'+
    '<div class="chk-progress-track"><div class="chk-progress-fill" style="width:'+pct+'%"></div></div>'+
    (a.map(x=>'<div class="chk-drawer-item'+(d.marcacoes[x.id]?' done':'')+'" data-drawer-check-item="1"><span class="chk-dot">'+(d.marcacoes[x.id]?'✓':'')+'</span><span class="chk-label">'+escapeHtmlCampanha(x.text)+'</span></div>').join('')||'<div class="empty">Nenhuma tarefa hoje.</div>')+
    (a.length?'<div class="chk-drawer-hint">Toque em um item pra abrir o Checklist e marcar quem fez</div>':'');
}
function abrirPainelConferencia(){
  let overlay = document.getElementById('conferencia-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'conferencia-overlay';
    overlay.innerHTML = '<div id="conferencia-panel">'+
      '<div class="cf-head"><h3>⚠ Pendências de conferência</h3><button type="button" id="cf-fechar">✕</button></div>'+
      '<div id="cf-lista"></div>'+
      '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#cf-fechar').onclick = ()=> overlay.classList.remove('open');
    overlay.onclick = (ev)=>{ if(ev.target===overlay) overlay.classList.remove('open'); };
  }
  renderPainelConferenciaLista();
  overlay.classList.add('open');
}
function renderPainelConferenciaLista(){
  const el = document.getElementById('cf-lista');
  if(!el) return;
  const pendentes = (state.pendenciasConferencia||[]).filter(x=>x.status==='pendente');
  if(pendentes.length===0){ el.innerHTML = '<div class="empty">Nenhuma pendência no momento. 🎉</div>'; return; }
  el.innerHTML = pendentes.map(p=>
    '<div class="cf-item">'+
      '<div class="cf-tipo">'+escapeHtmlCampanha(p.tipo||'')+(p.campo?(' · '+escapeHtmlCampanha(p.campo)):'')+'</div>'+
      '<div class="cf-detalhe">'+escapeHtmlCampanha(p.detalhe||'')+'</div>'+
      (p.valor ? '<div class="cf-valor">Valor: '+(typeof p.valor==='number'?fmtMoney(p.valor):escapeHtmlCampanha(String(p.valor)))+'</div>' : '')+
      '<div class="cf-acoes">'+
        '<button type="button" class="btn small" data-cf-resolver="'+p.id+'">✓ Marcar resolvida</button>'+
        '<button type="button" class="btn small ghost" data-cf-excluir="'+p.id+'">🗑 Excluir</button>'+
      '</div>'+
    '</div>'
  ).join('');
  el.querySelectorAll('[data-cf-resolver]').forEach(btn=>btn.onclick=async()=>{
    const p = (state.pendenciasConferencia||[]).find(x=>x.id===btn.dataset.cfResolver);
    if(p){ p.status='resolvida'; await save('pendenciasConferencia'); renderPainelConferenciaLista(); initConferenciaBadge(); }
  });
  el.querySelectorAll('[data-cf-excluir]').forEach(btn=>btn.onclick=async()=>{
    if(!confirm('Excluir esta pendencia de conferencia?')) return;
    state.pendenciasConferencia = (state.pendenciasConferencia||[]).filter(x=>x.id!==btn.dataset.cfExcluir);
    await save('pendenciasConferencia');
    renderPainelConferenciaLista(); initConferenciaBadge();
  });
}
function initConferenciaBadge(){let b=document.getElementById('conferencia-badge');if(!b){b=document.createElement('button');b.id='conferencia-badge';b.style='position:fixed;right:18px;bottom:18px;z-index:9999;border:0;border-radius:999px;padding:10px 14px;background:#f59e0b;color:#fff;font-weight:700;cursor:pointer';document.body.appendChild(b);b.onclick=abrirPainelConferencia;}const n=(state.pendenciasConferencia||[]).filter(x=>x.status==='pendente').length;b.style.display=n?'block':'none';b.textContent='⚠ '+n+' conferência(s)';}

function initChecklistHoverDrawer(){

    d.classList.remove('open');
    renderAll();
    setTimeout(()=>{ const main=document.getElementById('main'); if(main) main.scrollIntoView({behavior:'smooth'}); },50);
  };
  renderChecklistHoverDrawer();
}
function normalizarBuscaWs(str){return (str||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function renderWsResultados(termo){
  const el=document.getElementById('ws-resultados'); if(!el) return;
  const t=normalizarBuscaWs(termo||'').trim();
  const tDigits=apenasDigitos(termo||'');
  let lista=(state.clientes||[]);
  if(t || tDigits){
    lista=lista.filter(c=>{
      const nomeOk=normalizarBuscaWs(c.nome).includes(t);
      const endOk=normalizarBuscaWs((c.endereco||'')+' '+(c.complemento||'')).includes(t);
      const telOk=tDigits && apenasDigitos(c.telefone).includes(tDigits);
      return (t && (nomeOk||endOk)) || telOk;
    });
  }
  lista=lista.slice(0,60);
  if(lista.length===0){ el.innerHTML='<div class="empty">Nenhum cliente encontrado.</div>'; return; }
  el.innerHTML=lista.map(c=>{
    const inicial=(c.nome||'?').trim().charAt(0).toUpperCase();
    const link=linkWhatsApp(c.telefone);
    const endTxt=[c.endereco,c.complemento].filter(Boolean).join(', ');
    return '<div class="ws-item">'+
      '<div class="ws-avatar">'+inicial+'</div>'+
      '<div class="ws-info"><div class="ws-nome">'+escapeHtmlCampanha(c.nome)+'</div>'+
      '<div class="ws-meta">'+escapeHtmlCampanha(endTxt||'Sem endereço')+(c.telefone?' • '+escapeHtmlCampanha(c.telefone):'')+'</div>'+
      '<div style="margin-top:3px;">'+etiquetaFrequenciaClienteHtml(c.nome,{compacta:true})+'</div></div>'+
      (link?'<a class="ws-whats-btn" href="'+link+'" target="_blank" rel="noopener" title="Abrir WhatsApp">'+iconWhatsApp('#fff',17)+'</a>':'<span class="ws-no-phone">sem tel.</span>')+
      '</div>';
  }).join('');
}
function initWhatsFab(){
  const fab=document.getElementById('whats-fab'), overlay=document.getElementById('whats-search-overlay'),
    fechar=document.getElementById('ws-fechar'), input=document.getElementById('ws-search-input');
  if(!fab||fab.dataset.init) return; fab.dataset.init='1';
  const abrir=()=>{overlay.classList.add('open'); input.value=''; renderWsResultados(''); setTimeout(()=>input.focus(),50);};
  const fecharPainel=()=>overlay.classList.remove('open');
  fab.onclick=abrir;
  fechar.onclick=fecharPainel;
  overlay.onclick=(ev)=>{ if(ev.target===overlay) fecharPainel(); };
  input.oninput=()=>renderWsResultados(input.value);
  document.addEventListener('keydown',(ev)=>{ if(ev.key==='Escape') fecharPainel(); });
}

/* Estoque mínimo (só considera o "cheio", que é o que vende) — quando o estoque físico
   cheio de um item cai abaixo desse número, o sistema mostra um alerta no Painel e no Estoque. */
function defaultEstoqueMinimo(){
  return {
    gas: { P5:0, P13:0, P20:0, P45:0 },
    agua: { dfonte:0, safira:0 }
  };
}
function itensAbaixoDoMinimo(){
  if(!state.estoqueMinimo) return [];
  const alertas = [];
  ['gas','agua'].forEach(grupo=>{
    const chaves = grupo==='gas' ? ITENS_GAS_COMODATO : ITENS_AGUA_COMODATO.map(p=>p[1]);
    chaves.forEach(chave=>{
      const min = (state.estoqueMinimo[grupo] && state.estoqueMinimo[grupo][chave]) || 0;
      if(min<=0) return;
      const atual = (state.estoque[grupo] && state.estoque[grupo][chave] && state.estoque[grupo][chave].cheio) || 0;
      if(atual < min){
        const label = grupo==='gas' ? chave : (ITENS_AGUA_COMODATO.find(p=>p[1]===chave)||[chave])[0];
        alertas.push({grupo, chave, label, atual, min});
      }
    });
  });
  return alertas;
}

function parseValorBR(str){
  str = String(str==null?'':str).trim();
  if(!str) return NaN;
  const lastComma = str.lastIndexOf(',');
  const lastDot = str.lastIndexOf('.');
  if(lastComma>-1 && lastDot>-1){
    if(lastComma>lastDot){ str = str.replace(/\./g,'').replace(',', '.'); }
    else { str = str.replace(/,/g,''); }
  } else if(lastComma>-1){
    str = str.replace(',', '.');
  }
  return Number(str);
}

/* ===================== Etiqueta de frequência do cliente (remarketing) ===================== */
function classificarFrequenciaCliente(nome){
  const datas = historicoComprasCliente(nome);
  const total = datas.length;
  if(total===0) return {cor:'vermelho', label:'Nunca comprou', dias:null, total};
  const ultima = datas[datas.length-1];
  const dias = diasEntre(ultima, todayStr());
  // poucas compras no histórico (raramente compra), com um tempo já sem voltar
  if(total<=2 && dias>45){
    if(dias>150) return {cor:'vermelho', label:'Sumiu (compra rara)', dias, total};
    return {cor:'roxo', label:'Compra raramente', dias, total};
  }
  if(dias<=30) return {cor:'verde', label:'Cliente assíduo', dias, total};
  if(dias<=60) return {cor:'amarelo', label:'+1 mês sem comprar', dias, total};
  if(dias<=150) return {cor:'roxo', label:'Vários meses sem comprar', dias, total};
  return {cor:'vermelho', label:'Sumido há muito tempo', dias, total};
}
const CORES_FREQ_CLIENTE = {
  verde:   {bg:'var(--green-tint)',  fg:'var(--green)'},
  amarelo: {bg:'var(--amber-tint)',  fg:'var(--amber)'},
  roxo:    {bg:'var(--purple-tint)', fg:'var(--purple)'},

function previsaoRecompraClientes(){
  const nomes = Array.from(new Set(state.vendas.filter(v=>v.cliente).map(v=>v.cliente)));
  const hoje = todayStr();
  const resultados = [];
  nomes.forEach(nome=>{
    const datas = historicoComprasCliente(nome);
    if(datas.length<2) return; // precisa de pelo menos 2 compras pra calcular uma média
    const intervalos = [];
    for(let i=1;i<datas.length;i++){
      const dias = diasEntre(datas[i-1], datas[i]);
      if(dias>0) intervalos.push(dias);
    }
    if(intervalos.length===0) return;
    const media = Math.round(intervalos.reduce((s,d)=>s+d,0)/intervalos.length);
    const ultima = datas[datas.length-1];
    const diasDesde = diasEntre(ultima, hoje);
    resultados.push({nome, ultima, media, diasDesde, atraso: diasDesde-media, telefone: getClienteTelefone(nome)});
  });
  return resultados.sort((a,b)=>b.atraso-a.atraso);
}
function getClienteTelefone(nome){
  const c = state.clientes.find(x=>x.nome===nome);
  return c ? c.telefone : '';
}
function aplicarPlaceholdersMensagem(texto, dados){

    .replace(/\{media\}/g, dados.media!=null?String(dados.media):'');
}

function destinatariosPublico(p){
  const clientes=state.clientes||[];
  if(!p) return [];
  if(p.tipo==='clientes') return clientes.filter(c=>(p.clienteIds||[]).includes(c.id)&&c.telefone).map(c=>({id:c.id,nome:c.nome,telefone:c.telefone}));
  if(p.tipo==='grupo'){ const gr=p.grupos||[]; return clientes.filter(c=>c.telefone&&gruposClienteDoCliente(c).some(g=>gr.includes(g))).map(c=>({id:c.id,nome:c.nome,telefone:c.telefone})); }
  if(p.tipo==='endereco'){
    const kws=(p.enderecoTexto||'').split(',').map(s=>chaveNormalizada(s.trim())).filter(Boolean);
    if(!kws.length) return [];
    return clientes.filter(c=>{ const alvo=chaveNormalizada((c.endereco||'')+' '+(c.complemento||'')); return c.telefone && kws.some(k=>alvo.includes(k)); }).map(c=>({id:c.id,nome:c.nome,telefone:c.telefone}));
  }
  if(p.tipo==='inadimplentes'){
    const min=Number(p.valorMinimo)||0;
    return clientes.filter(c=>c.telefone && saldoDoCliente(c.nome)>min).map(c=>({id:c.id,nome:c.nome,telefone:c.telefone}));
  }
  if(p.tipo==='vip'){
    const min=Number(p.valorMinimo)||0;
    return clientes.filter(c=>c.telefone && valorTotalCompradoCliente(c.nome)>=min).sort((a,b)=>valorTotalCompradoCliente(b.nome)-valorTotalCompradoCliente(a.nome)).map(c=>({id:c.id,nome:c.nome,telefone:c.telefone}));
  }
  if(p.tipo==='recompra'){
    const diasMin=Number(p.diasMinimo)||0;
    return previsaoRecompraClientes().filter(r=>r.atraso>diasMin && r.telefone).map(r=>{ const c=clientes.find(x=>x.nome===r.nome); return {id:c?c.id:r.nome, nome:r.nome, telefone:r.telefone}; });
  }
  if(p.tipo==='comodato'){
    return clientes.filter(c=>c.telefone && saldoComodatoCliente(c.nome)>0).map(c=>({id:c.id,nome:c.nome,telefone:c.telefone}));
  }
  return clientes.filter(c=>c.telefone).map(c=>({id:c.id,nome:c.nome,telefone:c.telefone}));
}

async function enviarCampanhaAutomatica(campanha, destinatarios, btn){
  if(!campanha || !destinatarios.length){ alert('Não há destinatários para esta campanha.'); return; }
  if(!confirm('Enviar esta campanha automaticamente para '+destinatarios.length+' cliente(s) pelo WhatsApp Business?')) return;
  if(btn){ btn.disabled=true; btn.textContent='⏳ enviando...'; }
  let ok=0, falhas=[];
  for(const d of destinatarios){
    try{
      const payload={
        campanhaId:campanha.id,
        clienteId:d.id,
        nome:d.nome,
        telefone:d.telefone,
        mensagem:aplicarPlaceholdersMensagem(campanha.mensagem,{nome:d.nome}),
        imagemBase64:campanha.imagemBase64||null,
        videoDataUrl:campanha.videoDataUrl||null,
        linkVideo:campanha.linkVideo||null
      };
      const {data,error}=await supabaseClient.functions.invoke('enviar-whatsapp-campanha',{body:payload});
      if(error) throw error;
      if(data && data.ok===false) throw new Error(data.error||'Falha no envio');
      if(!jaEnviouCampanha(campanha.id,d.nome)) state.envioCampanhaLog.push({campanhaId:campanha.id,cliente:d.nome,data:todayStr(),automatico:true});
      ok++;
    }catch(e){ falhas.push(d.nome+': '+(e.message||e)); }
    if(btn) btn.textContent='⏳ '+ok+'/'+destinatarios.length+' enviados';
  }
  await save('envioCampanhaLog');
  if(btn){ btn.disabled=false; btn.textContent='🚀 enviar automaticamente'; }
  renderAll();
  alert('Envio concluído: '+ok+' enviado(s).'+(falhas.length?'\n\nFalhas ('+falhas.length+'):\n'+falhas.join('\n'):'')+'\n\nO envio automático usa a API oficial do WhatsApp Business configurada no Supabase.');
}

function paradasDoDiaHtml(dataAlvo){

  const entregasDoDia = todosAgendamentosEVendas().filter(v=>v.data===data && v.status!=='concluido').sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
  const paradasEntrega = entregasDoDia.map(v=>({
    tipo:'entrega', nome:v.cliente||'Entrega', endereco:getClienteEndereco(v.cliente), obs:(v.hora||'')+' — '+(v.produto||''),
    id:v.id, cliente:v.cliente||'', agendamentoId:v.agendamentoId, entregadorId:v.entregadorId||''
  }));

function pontoPartidaAtual(){
  if(!Array.isArray(state.pontosPartida) || state.pontosPartida.length===0) return null;
  return state.pontosPartida.find(p=>p.id===(state.rotaConfig||{}).pontoPartidaId) || state.pontosPartida[0];
}
function montarUrlRotaGoogleMaps(paradas, origemEndereco){
  const enderecos = paradas.map(p=>p.endereco).filter(e=>e && e.trim());
  if(enderecos.length===0) return null;
  const destino = enderecos[enderecos.length-1];
  const waypoints = enderecos.slice(0,-1);
  let url = 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(destino)+'&travelmode=driving';
  if(origemEndereco && origemEndereco.trim()) url += '&origin='+encodeURIComponent(origemEndereco.trim());
  if(waypoints.length>0) url += '&waypoints='+waypoints.map(w=>encodeURIComponent(w)).join('|');
  return url;
}

function viewTempoEntrega(){

  const fmtHora = iso=> iso ? new Date(iso).toLocaleString('pt-BR') : '—';

}

function novoItemVendaRow(opts){

    const etiquetaEl = div.querySelector('#'+etiquetaId);

      grupoEl.value = contexto.grupo;
      if(grupoEl.onchange) grupoEl.onchange();
    }
    if(contexto.grupo==='outros' && etiquetaEl && contexto.etiqueta){
      etiquetaEl.value = contexto.etiqueta;
      if(etiquetaEl.onchange) etiquetaEl.onchange();
    }
    div.querySelectorAll('.iv-grupo-field, .iv-etiqueta-field').forEach(function(e){ e.style.display='none'; });
    const btnTrocar = div.querySelector('.iv-trocar-categoria');
    if(btnTrocar) btnTrocar.onclick = ()=>{
      div.querySelectorAll('.iv-grupo-field').forEach(function(e){ e.style.display=''; });
      const grupoElAtual = div.querySelector('.iv-grupo-select');
      if(grupoElAtual && grupoElAtual.value==='outros'){
        div.querySelectorAll('.iv-etiqueta-field').forEach(function(e){ e.style.display='block'; });
      }
      const hintEl = div.querySelector('.hint');
      if(hintEl) hintEl.remove();
    };
    const selProdutoCompact = div.querySelector('.iv-produto-select');
    setTimeout(function(){ if(selProdutoCompact) selProdutoCompact.focus(); }, 0);
  }
  div.querySelector('.iv-remove').onclick = ()=>{ div.remove(); atualizarTotalCarrinho(); };
  div.querySelectorAll('.iv-quantidade,.iv-valor-unit').forEach(inp=>inp.oninput = atualizarTotalCarrinho);
  return div;
}

function obterContextoUltimoItemVenda(){
  const linhas = todasLinhasItemVenda();
  if(linhas.length===0) return null;
  const ultima = linhas[linhas.length-1];
  const grupoEl = ultima.querySelector('.iv-grupo-select');
  const etiquetaEl = ultima.querySelector('.iv-etiqueta-select');
  if(!grupoEl || !grupoEl.value) return null;
  if(grupoEl.value==='outros' && (!etiquetaEl || !etiquetaEl.value)) return null;
  return { grupo: grupoEl.value, etiqueta: grupoEl.value==='outros' ? etiquetaEl.value : null };
}

function tentarAutoPreencherPreco(categoria, nomeDigitado, inputValorUnit){
  if(!inputValorUnit || !nomeDigitado) return;
  const match = produtosDaCategoria(categoria).find(p=>p.nome.toLowerCase()===nomeDigitado.trim().toLowerCase());
  if(match) inputValorUnit.value = Number(match.preco).toFixed(2);
}
function grupoDaCategoria(categoria){
  const info = CATEGORIAS_ESTOQUE[categoria];
  if(info) return info.grupo==='gas' ? 'gas' : 'agua';
  return categoria ? 'outros' : '';
}
function produtosFixosDoGrupo(grupo){

    .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}

function wireSeletorCategoria(cfg){
  const grupoEl = document.getElementById(cfg.grupoId);
  const etiquetaWrapEl = document.getElementById(cfg.etiquetaWrapId);
  const etiquetaEl = document.getElementById(cfg.etiquetaId);
  const produtoWrapEl = document.getElementById(cfg.produtoWrapId);
  const produtoEl = document.getElementById(cfg.produtoId);
  const categoriaHiddenEl = document.getElementById(cfg.categoriaHiddenId);
  const manualWrapEl = cfg.manualWrapId ? document.getElementById(cfg.manualWrapId) : null;
  if(!grupoEl || !produtoEl || !categoriaHiddenEl) return null;

  const handleProdutoChange = ()=>{
    if(produtoEl.value==='__outro__'){
      if(manualWrapEl) manualWrapEl.style.display = 'block';
      categoriaHiddenEl.value = etiquetaEl ? etiquetaEl.value : '';
      if(cfg.produtoLivreEl){ cfg.produtoLivreEl.value=''; cfg.produtoLivreEl.focus(); }
      return;
    }
    if(manualWrapEl) manualWrapEl.style.display = 'none';
    const opt = produtoEl.selectedOptions[0];
    if(grupoEl.value==='outros'){
      categoriaHiddenEl.value = etiquetaEl ? etiquetaEl.value : '';
    } else {
      categoriaHiddenEl.value = produtoEl.value;
    }
    if(cfg.produtoLivreEl) cfg.produtoLivreEl.value = produtoEl.value;
    if(opt && opt.dataset.preco && cfg.valorUnitEl) cfg.valorUnitEl.value = Number(opt.dataset.preco).toFixed(2);
    try{ if(cfg.onProdutoChange) cfg.onProdutoChange(opt); }
    catch(e){ console.error('Erro em onProdutoChange', e); }
    finally{ if(typeof atualizarTotalCarrinho==='function') atualizarTotalCarrinho(); }
  };
  produtoEl.onchange = handleProdutoChange;
  produtoEl.addEventListener('input', handleProdutoChange);

  const atualizarEtiqueta = (produtoPreSelecionado)=>{
    if(!etiquetaEl) return;
    const unico = popularSelectProdutoCatalogo(cfg.produtoId, etiquetaEl.value);
    if(produtoWrapEl) produtoWrapEl.style.display = 'block';
    if(manualWrapEl) manualWrapEl.style.display = 'none';
    if(produtoPreSelecionado){ produtoEl.value = produtoPreSelecionado; handleProdutoChange(); }
    else if(unico) handleProdutoChange();
  };
  if(etiquetaEl) etiquetaEl.onchange = ()=>atualizarEtiqueta();

  const atualizarGrupo = (etiquetaPre, produtoPre)=>{
    categoriaHiddenEl.value = '';
    if(grupoEl.value==='outros'){
      if(etiquetaWrapEl) etiquetaWrapEl.style.display = 'block';
      if(produtoWrapEl) produtoWrapEl.style.display = etiquetaPre ? 'block' : 'none';
      if(manualWrapEl) manualWrapEl.style.display = 'none';
      if(etiquetaEl){
        etiquetaEl.innerHTML = opcoesComPlaceholder(categoriasNaoControladas(),'Selecione o tipo');
        etiquetaEl.value = etiquetaPre || '';
      }
      if(etiquetaPre) atualizarEtiqueta(produtoPre);
      else if(produtoEl) produtoEl.innerHTML = '<option value="" selected disabled>Selecione o tipo primeiro</option>';
    } else if(grupoEl.value==='gas' || grupoEl.value==='agua'){
      if(etiquetaWrapEl) etiquetaWrapEl.style.display = 'none';
      if(produtoWrapEl) produtoWrapEl.style.display = 'block';
      if(manualWrapEl) manualWrapEl.style.display = 'none';
      popularSelectProdutoFixo(cfg.produtoId, grupoEl.value);
      if(produtoPre){ produtoEl.value = produtoPre; handleProdutoChange(); }
    } else {
      if(etiquetaWrapEl) etiquetaWrapEl.style.display = 'none';
      if(produtoWrapEl) produtoWrapEl.style.display = 'none';
    }
  };
  grupoEl.onchange = ()=>atualizarGrupo();

  return {
    atualizarGrupo,
    setValor(categoria, produtoNome){
      const grupo = grupoDaCategoria(categoria);
      if(!grupo) return;
      grupoEl.value = grupo;
      if(grupo==='outros') atualizarGrupo(categoria, produtoNome||'__outro__');
      else atualizarGrupo(null, produtoNome||categoria);
    }
  };
}
function popularSelectProdutoCatalogo(selectId, categoria){
  const sel = document.getElementById(selectId);
  if(!sel) return null;
  const produtos = produtosDaCategoria(categoria);
  sel.innerHTML = '<option value="" selected disabled>Selecione o produto</option>'+
    produtos.map(p=>'<option value="'+p.nome+'" data-preco="'+p.preco+'">'+p.nome+' — '+fmtMoney(p.preco)+'</option>').join('')+
    '<option value="__outro__">Outro (digitar manualmente)</option>';
  if(produtos.length===1){ sel.value = produtos[0].nome; return produtos[0]; }
  return null;
}
function calcularTotalCarrinho(){
  const fvEl = document.getElementById('form-venda');
  let total = 0;
  if(fvEl && fvEl.quantidade && fvEl.valor_unit){
    total += (Number(fvEl.quantidade.value)||0) * (Number(fvEl.valor_unit.value)||0);
  }
  document.querySelectorAll('.iv-extra-row').forEach(row=>{
    const q = Number(row.querySelector('.iv-quantidade').value)||0;
    const v = Number(row.querySelector('.iv-valor-unit').value)||0;
    total += q*v;
  });
  const freteEl = document.getElementById('input-frete');
  const frete = freteEl ? (Number(freteEl.value)||0) : 0;
  return {total, frete};
}
function atualizarTotalCarrinho(){
  const totalEl = document.getElementById('carrinho-total');
  if(!totalEl) return;
  try{
    const {total, frete} = calcularTotalCarrinho();
    totalEl.textContent = frete>0 ?
      'Produtos: '+fmtMoney(total)+'  +  Frete: '+fmtMoney(frete)+'  =  Total: '+fmtMoney(total+frete) :
      'Total do carrinho: '+fmtMoney(total);
  }catch(e){ console.error('Erro ao calcular total do carrinho', e); }
  try{ atualizarBoxCreditoVenda(); }catch(e){ console.error('Erro ao atualizar box de crédito', e); }
}
function atualizarBoxCreditoVenda(){
  const box = document.getElementById('credito-cliente-box');
  const fvEl = document.getElementById('form-venda');
  if(!box || !fvEl) return;
  const nomeCliente = fvEl.cliente ? fvEl.cliente.value.trim() : '';
  const saldo = nomeCliente ? saldoCreditoCliente(nomeCliente) : 0;
  if(!nomeCliente || saldo<=0.004){
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  const {total, frete} = calcularTotalCarrinho();
  const totalVenda = Math.round((total+frete)*100)/100;
  const chkAntigo = document.getElementById('chk-usar-credito');
  const usar = chkAntigo ? chkAntigo.checked : false;
  const abatido = usar ? Math.round(Math.min(saldo, totalVenda)*100)/100 : 0;
  const diferenca = Math.round((totalVenda - abatido)*100)/100;
  const opcoesDiferenca = ['Marcou/Fiado'].concat(PAGAMENTOS.filter(p=>p!=='Abateu' && p!=='Marcou/Fiado'));
  box.style.display = 'block';
  box.innerHTML = '<div class="item-venda-row" style="background:var(--purple-tint);border-color:var(--purple);">'+
    '<div><strong>💰 '+nomeCliente+' tem '+fmtMoney(saldo)+' de crédito em haver.</strong></div>'+
    '<label class="checkbox-item" style="margin-top:6px;"><input type="checkbox" id="chk-usar-credito" '+(usar?'checked':'')+'> Usar crédito nesta venda</label>'+
    (usar ? (
      '<div class="hint" style="margin-top:6px;">Total da venda: '+fmtMoney(totalVenda)+' — abatido do crédito: <strong>'+fmtMoney(abatido)+'</strong>'+
      (diferenca>0.004 ? '. Ainda falta pagar <strong>'+fmtMoney(diferenca)+'</strong>.' : '. Cobre o valor total — nada mais a pagar.') +'</div>'+
      (diferenca>0.004 ? (
        '<div style="margin-top:8px;"><label>Como a diferença de '+fmtMoney(diferenca)+' vai ser paga?</label>'+
        '<select id="sel-forma-diferenca-credito">'+
        opcoesDiferenca.map(p=>'<option value="'+p+'">'+(p==='Marcou/Fiado'?'Fica de fiado (a receber)':p)+'</option>').join('')+
        '</select></div>'
      ) : '')
    ) : '')+
    '</div>';
  const novoChk = document.getElementById('chk-usar-credito');
  if(novoChk) novoChk.onchange = atualizarBoxCreditoVenda;
}

async function save(key){
  try{
    const { data, error } = await supabaseClient.from('app_data')
      .upsert({ chave:key, valor: state[key], atualizado_em: new Date().toISOString() }, { onConflict: 'chave' })
      .select();
    if(error) throw error;
    if(!data || data.length===0){
      console.warn('O upsert não retornou linhas para "'+key+'" — normalmente isso indica que falta a política de UPDATE na tabela app_data (RLS).');
      alert('Os dados não foram salvos no Supabase. Confira se a tabela app_data tem a política de UPDATE para usuários autenticados, além da de INSERT.');
      return false;
    }
    return true;
  }catch(e){ console.error('Erro ao salvar', key, e); alert('Não foi possível salvar no Supabase: '+(e.message||e)); return false; }
}

function baixarBase64(nomeArquivo, base64Str, mime){
  const link = document.createElement('a');
  link.href = 'data:'+mime+';base64,'+base64Str;
  link.download = nomeArquivo;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
function baixarJson(nomeArquivo, objeto){
  const blob = new Blob([JSON.stringify(objeto, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function existeBackup(chave){
  try{
    const { data, error } = await supabaseClient.from('app_data').select('chave').eq('chave', chave).limit(1);
    if(error) throw error;
    return !!(data && data.length>0);
  }catch(e){ console.error('Erro ao checar backup', e); return true; }
}
async function criarBackupComChave(chave, tipo){
  try{
    const valor = { tipo: tipo, criado_em: new Date().toISOString(), dados: montarSnapshotBackup() };
    const { error } = await supabaseClient.from('app_data')
      .upsert({ chave: chave, valor: valor, atualizado_em: new Date().toISOString() }, { onConflict:'chave' });
    if(error) throw error;
    limparBackupsAntigos();
    return true;
  }catch(e){ console.error('Erro ao criar backup', e); return false; }
}
async function criarBackup(tipo){
  const chave = tipo==='manual' ? chaveBackupAgora() : chaveBackupHoje();
  return criarBackupComChave(chave, tipo);
}
function chaveBackupAgora(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  return 'backup:'+todayStr()+'T'+hh+mm+ss;
}
async function limparBackupsAntigos(){
  try{
    const { data, error } = await supabaseClient.from('app_data').select('chave').like('chave','backup:%').order('chave', {ascending:false});
    if(error || !data) return;
    const excedentes = data.slice(30).map(r=>r.chave);
    if(excedentes.length>0){
      await supabaseClient.from('app_data').delete().in('chave', excedentes);
    }
  }catch(e){ console.error('Erro ao limpar backups antigos', e); }
}
function mostrarAvisoFlutuante(msg, cor){
  const div = document.createElement('div');
  div.textContent = msg;
  div.style.cssText = 'position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:0 auto;background:'+(cor||'#c62828')+';color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:99999;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;';
  div.onclick = ()=>div.remove();
  document.body.appendChild(div);
  setTimeout(()=>{ if(div.parentNode) div.remove(); }, 12000);
}
async function rodarBackupAutomaticoSeNecessario(){
  // Feito na primeira abertura do dia: como ainda não foi lançado nada hoje,
  // o estado atual reflete o fechamento de ONTEM — é isso que fica registrado.
  // Sempre grava direto (upsert) — não depende mais de checagem prévia que podia falhar silenciosamente.
  const dataFechamento = diaAnteriorStr(todayStr());
  const chave = 'backup:'+dataFechamento;
  const ok = await criarBackupComChave(chave, 'automatico');
  ultimoBackupAutomaticoOk = ok;
  ultimoBackupAutomaticoQuando = new Date();
  if(!ok){
    console.error('Backup automático falhou ao abrir o sistema — veja o erro acima no console.');
    mostrarAvisoFlutuante('⚠️ O backup automático de hoje falhou. Vá em Configurações > Backups e clique em "Fazer backup agora".');
  }
}
async function renderListaBackups(){
  const container = document.getElementById('lista-backups');
  if(!container) return;
  try{
    const { data, error } = await supabaseClient.from('app_data').select('chave,valor').like('chave','backup:%').order('chave',{ascending:false}).limit(30);
    if(error) throw error;
    if(!data || data.length===0){ container.innerHTML = '<div class="empty">Nenhum backup ainda.</div>'; return; }
    container.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Data</th><th>Hora</th><th>Tipo</th><th></th></tr></thead><tbody>'+
      data.map(function(row){
        const partes = row.chave.replace('backup:','').split('T');
        const dataStr = partes[0];
        const horaStr = partes[1] ? (partes[1].slice(0,2)+':'+partes[1].slice(2,4)+':'+partes[1].slice(4,6)) : '—';
        const tipo = row.valor && row.valor.tipo==='manual' ? 'Manual' : 'Automático';
        return '<tr><td>'+fmtDate(dataStr)+'</td><td>'+horaStr+'</td><td>'+tipo+'</td>'+
          '<td><button class="act-link" data-baixar-backup="'+row.chave+'">⬇ baixar</button>'+
          '<button class="del-link" data-restaurar-backup="'+row.chave+'">↺ restaurar</button></td></tr>';
      }).join('')+'</tbody></table></div>';
    container.querySelectorAll('[data-baixar-backup]').forEach(btn=>btn.onclick=async()=>{
      const chave = btn.dataset.baixarBackup;
      const linha = (await supabaseClient.from('app_data').select('valor').eq('chave',chave).single()).data;
      if(!linha){ alert('Não foi possível baixar esse backup.'); return; }
      baixarJson(chave.replace(':','-')+'.json', linha.valor);
    });
    container.querySelectorAll('[data-restaurar-backup]').forEach(btn=>btn.onclick=async()=>{
      const chave = btn.dataset.restaurarBackup;
      const dataStr = chave.replace('backup:','').split('T')[0];
      if(!confirm('Isso vai SUBSTITUIR todos os dados atuais (vendas, clientes, produtos, tudo) pelo conteúdo do backup de '+fmtDate(dataStr)+'. Essa ação não pode ser desfeita. Continuar?')) return;
      if(!confirm('Tem certeza mesmo? Se ainda não fez um backup dos dados de agora, cancele e faça um backup manual antes.')) return;
      const linha = (await supabaseClient.from('app_data').select('valor').eq('chave',chave).single()).data;
      if(!linha || !linha.valor || !linha.valor.dados){ alert('Não foi possível ler esse backup.'); return; }
      const dados = linha.valor.dados;
      const chaves = Object.keys(dados);
      chaves.forEach(function(k){ state[k] = dados[k]; });
      for(const k of chaves){ await save(k); }
      alert('Backup restaurado com sucesso!');
      await loadAll();
      renderAll();
    });
  }catch(e){ console.error('Erro ao listar backups', e); container.innerHTML = '<div class="empty">Não foi possível carregar os backups.</div>'; }
}

function attachLogoInput(){
  const fileInput = document.getElementById('logo-file-input');
  fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      if(file.type==='image/gif'){
        // GIF animado: não passa pelo canvas (isso achataria a animação num frame só) — salva o arquivo original
        if(file.size > 3*1024*1024){ alert('Esse GIF está muito grande (máx. 3 MB). Escolha um arquivo menor.'); return; }
        (async()=>{
          state.logoUrl = ev.target.result;
          await save('logoUrl');
          renderHeaderLogo();
        })();
        return;
      }
      const img = new Image();
      img.onload = async ()=>{
        const maxW=220, maxH=76;
        let w=img.width, h=img.height;
        const scale = Math.min(maxW/w, maxH/h, 1);
        w=Math.round(w*scale); h=Math.round(h*scale);
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        state.logoUrl = canvas.toDataURL('image/png');
        await save('logoUrl');
        renderHeaderLogo();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
}

function clientesComFiado(){
  const nomes = new Set();
  state.fiados.forEach(f=>{ if(f.cliente) nomes.add(f.cliente); });
  state.vendas.forEach(v=>{ if(v.cliente && v.pagamento==='Marcou/Fiado') nomes.add(v.cliente); });
  state.fiadoPagamentos.forEach(p=>{ if(p.cliente) nomes.add(p.cliente); });
  return Array.from(nomes);
}
function debitosDoCliente(cliente){
  const manuais = state.fiados.filter(f=>f.cliente===cliente).map(f=>({id:f.id, data:f.data, descricao:f.descricao||'Fiado lançado manualmente', valor:f.valor}));
  const vendas = state.vendas.filter(v=>v.cliente===cliente && v.pagamento==='Marcou/Fiado').map(v=>({
    id:v.id, data:v.data,
    descricao:v.quantidade+'x '+v.produto+(v.frete?' + frete '+fmtMoney(v.frete):''),
    valor: v.valor_total + (v.frete||0)
  }));
  return manuais.concat(vendas).sort((a,b)=>a.data.localeCompare(b.data));
}
function pagamentosDoCliente(cliente){
  return state.fiadoPagamentos.filter(p=>p.cliente===cliente).sort((a,b)=>a.data.localeCompare(b.data));
}
function saldoDoCliente(cliente){
  const debitos = debitosDoCliente(cliente).reduce((s,d)=>s+d.valor,0);
  const pagos = pagamentosDoCliente(cliente).reduce((s,p)=>s+p.valor,0);
  return Math.max(0, debitos - pagos);
}
function totalFiadoAberto(){
  return clientesComFiado().reduce((s,c)=>s+saldoDoCliente(c), 0);
}
function totalEmHaver(){
  return clientesComCredito().reduce((s,c)=>s+Math.max(0,saldoCreditoCliente(c)), 0);
}
function totalConveniosMes(mk){
  const vendasConvenio = state.vendas.filter(v=>monthKey(v.data)===mk && v.empresa).reduce((s,v)=>s+v.valor_total,0);
  const lancConvenio = state.convenioLancamentos.filter(c=>monthKey(c.data)===mk).reduce((s,c)=>s+c.valor,0);
  return vendasConvenio + lancConvenio;
}

function destruirChart(id){ if(dashCharts[id]){ dashCharts[id].destroy(); delete dashCharts[id]; } }
function criarChart(id, config){
  const el = document.getElementById(id);

  if(typeof Chart==='undefined'){

function ajustaEstoquePorVenda(categoria, qtd, reverter){
  const info = CATEGORIAS_ESTOQUE[categoria];
  if(!info) return;
  const sinal = reverter ? -1 : 1;
  const bucket = info.grupo==='gas' ? state.estoque.gas[info.chave] : state.estoque.agua[info.chave];
  if(!bucket) return;
  if(info.tipo==='carga'){ bucket.cheio -= qtd*sinal; bucket.vazio += qtd*sinal; }
  else { bucket.vazio -= qtd*sinal; }
}

/* ---------- PRODUTOS ---------- */
function categoriasNaoControladas(){
  return state.categoriasProdutos.filter(c=>!isControlada(c));
}
function produtosDaCategoria(categoria){
  return state.produtos.filter(p=>p.categoria===categoria).sort((a,b)=>a.nome.localeCompare(b.nome));
}
function grupoDaSubcategoria(cat){
  return (state.categoriasProdutosGrupo && state.categoriasProdutosGrupo[cat]) || 'outros';
}
function subcategoriasDoGrupo(grupo){
  return categoriasNaoControladas().filter(c=>grupoDaSubcategoria(c)===grupo);
}
function despesasDaCategoria(categoria){
  return state.despesas.filter(d=>d.categoria===categoria);
}
function renomearCategoriaProduto(oldName, newName){
  const idx = state.categoriasProdutos.indexOf(oldName);
  if(idx>-1) state.categoriasProdutos[idx] = newName;
  state.produtos.forEach(function(p){ if(p.categoria===oldName) p.categoria = newName; });
  state.vendas.forEach(function(v){ if(v.categoria===oldName) v.categoria = newName; });
  state.agendamentos.forEach(function(a){ if(a.categoria===oldName) a.categoria = newName; });
  if(state.categoriasProdutosGrupo && Object.prototype.hasOwnProperty.call(state.categoriasProdutosGrupo, oldName)){
    state.categoriasProdutosGrupo[newName] = state.categoriasProdutosGrupo[oldName];
    delete state.categoriasProdutosGrupo[oldName];
  }
}
function renomearCategoriaDespesa(oldName, newName){
  const idx = state.categoriasDespesas.indexOf(oldName);
  if(idx>-1) state.categoriasDespesas[idx] = newName;
  state.despesas.forEach(function(d){ if(d.categoria===oldName) d.categoria = newName; });
}
function chaveNormalizada(str){
  return (str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
}
function mesclarCategoriasDuplicadas(){
  const vistos = {};
  const duplicatas = [];
  const novaLista = [];
  state.categoriasProdutos.forEach(function(cat){
    const chave = chaveNormalizada(cat);
    if(vistos[chave]){
      if(vistos[chave]!==cat) duplicatas.push({de:cat, para:vistos[chave]});
    } else {
      vistos[chave] = cat;
      novaLista.push(cat);
    }
  });
  duplicatas.forEach(function(d){
    state.produtos.forEach(function(p){ if(p.categoria===d.de) p.categoria = d.para; });
    state.vendas.forEach(function(v){ if(v.categoria===d.de) v.categoria = d.para; });
    state.agendamentos.forEach(function(a){ if(a.categoria===d.de) a.categoria = d.para; });
    if(state.categoriasProdutosGrupo && Object.prototype.hasOwnProperty.call(state.categoriasProdutosGrupo, d.de)){
      if(!state.categoriasProdutosGrupo[d.para]) state.categoriasProdutosGrupo[d.para] = state.categoriasProdutosGrupo[d.de];
      delete state.categoriasProdutosGrupo[d.de];
    }
  });
  state.categoriasProdutos = novaLista;
  return duplicatas.length;
}
function mesclarCategoriasDespesasDuplicadas(){
  const vistos = {};
  const duplicatas = [];
  const novaLista = [];
  state.categoriasDespesas.forEach(function(cat){
    const chave = chaveNormalizada(cat);
    if(vistos[chave]){
      if(vistos[chave]!==cat) duplicatas.push({de:cat, para:vistos[chave]});
    } else {
      vistos[chave] = cat;
      novaLista.push(cat);
    }
  });
  duplicatas.forEach(function(d){
    state.despesas.forEach(function(x){ if(x.categoria===d.de) x.categoria = d.para; });
  });
  state.categoriasDespesas = novaLista;
  return duplicatas.length;
}
function mesclarProdutosDuplicados(){
  const vistos = {};
  const manter = [];
  let removidos = 0;
  state.produtos.forEach(function(p){
    const chave = p.categoria+'||'+chaveNormalizada(p.nome);
    if(vistos[chave]){
      removidos++;
      const existente = vistos[chave];
      if((!existente.preco || existente.preco===0) && p.preco) existente.preco = p.preco;
    } else {
      vistos[chave] = p;
      manter.push(p);
    }
  });
  state.produtos = manter;
  return removidos;
}
function categoriasSuspeitasDuplicarEstoque(){
  return categoriasNaoControladas().filter(function(cat){
    const c = chaveNormalizada(cat);
    return /(^|\s)g[aá]s(\s|$)|glp|botij[aã]o|carga de g[aá]s|vasilhame de g[aá]s/.test(c) ||
      /safira|d ?fonte|dfonte|20\s*l(itros)?/.test(c);

}

function catalogoProdutosFiltradoHtml(q){

  if(catsComResultado.length===0) return '<div class="empty">Nenhum produto encontrado para "'+q+'".</div>';
  return catsComResultado.map(cat=>{

/* ---------- ESTOQUE ---------- */
const TAMANHOS_GAS = {P5:16, P13:22, P20:28, P45:34};
function pesoGasTotal(){
  const g = state.estoque.gas;
  let cheio=0, vazio=0;
  const porTipoCheio={}, porTipoVazio={};
  ['P5','P13','P20','P45'].forEach(t=>{
    const pc = (g[t].cheio||0)*PESO_GAS_KG[t];
    const pv = (g[t].vazio||0)*PESO_GAS_KG[t];
    cheio += pc; vazio += pv;
    porTipoCheio[t]=pc; porTipoVazio[t]=pv;
  });
  return {cheio, vazio, porTipoCheio, porTipoVazio};
}
const CAPACIDADE_GAS_KG = 1560;
function viewCapacidadeGas(){
  const cap = CAPACIDADE_GAS_KG;
  const p = pesoGasTotal();
  const ocupado = p.cheio + p.vazio;
  const pctCheio = Math.min(100, (p.cheio/cap)*100);
  const pctVazio = Math.min(100-pctCheio, (p.vazio/cap)*100);
  const pctOcupado = Math.min(100, (ocupado/cap)*100);
  const excedente = Math.max(0, ocupado-cap);
  const coresTipo = {P5:'#B45309', P13:'#1E3A8A', P20:'#0EA5E9', P45:'#7C3AED'};
  function segmentosHtml(porTipo, totalLado){
    if(totalLado<=0) return '';
    return ['P5','P13','P20','P45'].map(t=>{
      const w = porTipo[t];
      if(w<=0) return '';
      const pct = (w/totalLado)*100;
      return '<div class="cap-seg" style="width:'+pct+'%;background:'+coresTipo[t]+';" title="'+t+' — '+w.toFixed(1)+' kg"></div>';
    }).join('');
  }
  const legendaTipos = ['P5','P13','P20','P45'].map(t=>
    '<span><span class="dot" style="background:'+coresTipo[t]+';"></span>'+t+' — equivale a '+(PESO_GAS_KG[t]/13).toFixed(2)+' espaço(s) de P13</span>').join('');
  return '<div class="card"><h2>Capacidade de estoque de gás (Categoria 2) <span class="pill">'+cap.toLocaleString('pt-BR')+' kg</span></h2>'+
    '<div class="hint">O depósito começa com 0 kg ocupados e vai até o limite de <strong>'+cap.toLocaleString('pt-BR')+' kg</strong>. Cada casco ocupa espaço pelo peso do vasilhame — cheio ou vazio conta igual (P5=5kg, P13=13kg, P20=20kg, P45=45kg). Os cheios preenchem a barra a partir da esquerda, os vazios a partir da direita — o espaço em branco no meio é a capacidade ainda livre.</div>'+
    '<div class="cap-bar-wrap"><div class="cap-bar">'+
    '<div class="cap-lado cheio" style="width:'+pctCheio+'%;">'+segmentosHtml(p.porTipoCheio, p.cheio)+'</div>'+
    '<div class="cap-lado vazio" style="width:'+pctVazio+'%;">'+segmentosHtml(p.porTipoVazio, p.vazio)+'</div>'+
    '</div>'+
    '<div class="cap-legend">'+legendaTipos+'</div>'+
    '</div>'+
    (excedente>0 ? '<div class="hint" style="color:var(--danger);font-weight:600;margin-top:4px;">Atenção: o estoque está '+excedente.toFixed(1)+' kg acima do limite de '+cap+' kg da categoria.</div>' : '')+
    '<div class="grid cols4" style="margin-top:14px;">'+
    '<div class="metric"><div class="label">Ocupado</div><div class="value">'+ocupado.toFixed(1)+' kg</div></div>'+
    '<div class="metric"><div class="label">% da capacidade</div><div class="value">'+pctOcupado.toFixed(0)+'%</div></div>'+
    '<div class="metric"><div class="label">Cheios (equiv. P13)</div><div class="value">'+(p.cheio/13).toFixed(1)+'</div></div>'+
    '<div class="metric"><div class="label">Vazios (equiv. P13)</div><div class="value">'+(p.vazio/13).toFixed(1)+'</div></div>'+
    '</div></div>';
}

function getClienteEndereco(nome){
  if(!nome) return '—';
  const c = state.clientes.find(x=>x.nome.toLowerCase()===nome.toLowerCase());
  if(!c) return '—';
  const partes = [c.endereco,c.complemento].filter(Boolean);
  return partes.length ? partes.join(', ') : '—';
}
function listaAgendamentosDoDia(data){

    id:v.id, hora:v.entrega_hora, cliente:v.cliente, produto:v.categoria+(v.quantidade>1?' x'+v.quantidade:''),
    tipo_entrega:v.tipo_entrega, empresa:v.empresa, origem:'venda', status: v.entrega_status==='entregue' ? 'concluido' : 'pendente',
    entregadorId:'', agendamentoId:null, grupoId:v.grupoId||v.id
  }));
  const avulsos = state.agendamentos.filter(a=>a.data===data).map(a=>({
    id:a.id, hora:a.hora, cliente:a.cliente, produto:a.produto_nota, tipo_entrega:a.tipo_entrega, empresa:a.empresa,

}

function iniciarEditarAgendamento(id){
  const a = state.agendamentos.find(x=>x.id===id);
  const fa = document.getElementById('form-agendamento');
  if(!a || !fa) return;
  editAgendamentoId = a.id;
  fa.cliente.value=a.cliente||''; fa.data.value=a.data; fa.hora.value=a.hora;
  let categoriaParaPreencher = a.categoria || '';
  if(!categoriaParaPreencher && a.produto_nota){
    // agendamento antigo, criado antes da categoria existir: joga tudo como texto livre
    categoriaParaPreencher = state.categoriasProdutos.find(c=>!isControlada(c)) || '';
  }
  if(fa.quantidade) fa.quantidade.value = a.quantidade || 1;
  fa.tipo_entrega.value=a.tipo_entrega||''; fa.empresa.value=a.empresa||'';
  if(fa.pagamento) fa.pagamento.value=a.pagamento||PAGAMENTOS[0];
  if(fa.entregadorId) fa.entregadorId.value = a.entregadorId||'';
  if(fa.pago) fa.pago.checked = !!a.pago;
  if(fa.valor) fa.valor.value = a.valor ? Number(a.valor).toFixed(2) : '';
  if(fa.frete) fa.frete.value=a.frete||'';
  toggleDetalhesEntregaAgendamento();
  if(categoriaParaPreencher && seletorAgendamento){
    const nomeProduto = (a.categoria && !isControlada(a.categoria)) ? (a.produto||a.produto_nota||'') : '';
    seletorAgendamento.setValor(categoriaParaPreencher, nomeProduto);
  }
  toggleAvisoRetroativoAgendamento();
  const enderecoPreview = document.getElementById('ag-endereco-preview');
  if(enderecoPreview){
    const end = a.cliente ? getClienteEndereco(a.cliente) : '';
    enderecoPreview.innerHTML = end ? '📍 '+escapeHtmlCampanha(end) : '';
  }
  fa.querySelector('button[type=submit]').textContent='Salvar alterações';
  fa.scrollIntoView({behavior:'smooth'});
}
function diaChecklist(data){

function itemComodatoLabel(categoria, item){
  if(categoria==='Gás') return item;
  const par = ITENS_AGUA_COMODATO.find(p=>p[1]===item);
  return par ? par[0] : item;
}
function chaveComodato(c){ return [c.direcao, c.nome, c.categoria, c.item, c.produto].join('|'); }
/* Monta um objeto no mesmo formato usado pelos lançamentos de "Ajustar estoque manualmente"
   (tipo/item/itemChave/estado/direcao/quantidade), a partir de um lançamento de comodato,
   pra poder reaproveitar aplicarEfeitoEstoqueLanc() e refletir o comodato no estoque real.
   Direção "cliente" com quantidade positiva = saiu item da loja (estoque desce).
   Direção "atacadista" com quantidade positiva = entrou item extra do atacadista (estoque sobe). */
function efeitoEstoqueLancDeComodato(c){
  const grupoEstoque = c.categoria==='Gás' ? state.estoque.gas : state.estoque.agua;
  if(!grupoEstoque || !grupoEstoque[c.item]) return null;
  const itemLabel = c.categoria==='Gás' ? c.item : itemComodatoLabel(c.categoria, c.item);
  const estado = c.produto==='Vasilhame vazio' ? 'Vazio' : 'Cheio';
  const sinal = c.direcao==='cliente' ? -1 : 1;
  const delta = sinal * c.quantidade;
  if(delta===0) return null;
  return {
    id: uid(), criadoEm: Date.now(), data: c.data, tipo: c.categoria, item: itemLabel, itemChave: c.item,
    estado, direcao: delta>0 ? 'entrada' : 'saida', quantidade: Math.abs(delta),
    motivo: 'Comodato — '+(c.direcao==='cliente'?'emprestado a ':'recebido de ')+c.nome+(c.obs?' ('+c.obs+')':''),
    usuario: usuarioAtualNome
  };
}
function saldosComodato(direcao){
  const mapa = {};
  state.comodatos.filter(c=>c.direcao===direcao).forEach(c=>{
    const k = chaveComodato(c);
    if(!mapa[k]) mapa[k] = {nome:c.nome, categoria:c.categoria, item:c.item, produto:c.produto, saldo:0};
    mapa[k].saldo += c.quantidade;
  });
  return Object.values(mapa).filter(x=>x.saldo!==0).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function tabelaSaldosComodato(direcao, tituloColuna){
  const linhas = saldosComodato(direcao);
  if(linhas.length===0) return '<div class="empty">Nada em aberto.</div>';
  return '<div class="table-wrap"><table><thead><tr><th>'+tituloColuna+'</th><th>Categoria / Item</th><th>Produto</th><th>Saldo</th></tr></thead><tbody>'+
    linhas.map(l=>'<tr><td>'+l.nome+'</td><td>'+l.categoria+' — '+itemComodatoLabel(l.categoria,l.item)+'</td><td>'+l.produto+'</td>'+
    '<td>'+(l.saldo>0?'+':'')+l.saldo+'</td></tr>').join('')+
    '</tbody></table></div>';
}
/* Soma o saldo de comodato em aberto (todos os nomes juntos) pra um item/estado específico.
   direcao='cliente' -> itens emprestados a clientes (ainda são nossos, só estão fora).
   direcao='atacadista' -> itens que devemos ao atacadista (estão com a gente, mas não são nossos). */
function saldoComodatoPorItem(direcao, grupoEstoque, itemChave, estado){
  const categoriaComodato = grupoEstoque==='gas' ? 'Gás' : 'Água';
  const produtoAlvo = estado==='vazio' ? 'Vasilhame vazio' : 'Carga completa (cheio)';
  return state.comodatos
    .filter(c=>c.direcao===direcao && c.categoria===categoriaComodato && c.item===itemChave && c.produto===produtoAlvo)
    .reduce((s,c)=>s+c.quantidade, 0);
}
/* Patrimônio real de um item = estoque físico na loja + o que está emprestado com clientes
   (continua sendo nosso) - o que devemos ao atacadista (está com a gente mas não é nosso). */
function linhaPatrimonioItem(grupoEstoque, itemChave, label){
  const fisico = (state.estoque[grupoEstoque] && state.estoque[grupoEstoque][itemChave]) || {cheio:0,vazio:0};
  const linhas = ['cheio','vazio'].map(estado=>{
    const fisicoQtd = fisico[estado]||0;
    const emprestado = saldoComodatoPorItem('cliente', grupoEstoque, itemChave, estado);
    const devendo = saldoComodatoPorItem('atacadista', grupoEstoque, itemChave, estado);
    return {estado, fisicoQtd, emprestado, devendo, patrimonio: fisicoQtd + emprestado - devendo};
  });
  return {chave:itemChave, label, linhas};
}
function tabelaPatrimonioGrupo(titulo, linhasGrupo){
  const soma = (campo)=>linhasGrupo.reduce((s,it)=>s+it.linhas.reduce((s2,l)=>s2+l[campo],0),0);
  return '<h3 style="margin-top:16px;">'+titulo+'</h3>'+
    '<div class="table-wrap"><table><thead><tr><th>Item</th><th>Estado</th><th>Estoque físico</th><th>Emprestado a clientes</th><th>Devemos ao atacadista</th><th>Patrimônio real</th></tr></thead><tbody>'+
    linhasGrupo.map(it=>it.linhas.map((l,idx)=>
      '<tr><td>'+(idx===0?it.label:'')+'</td><td>'+(l.estado==='cheio'?'Cheio':'Vazio')+'</td>'+
      '<td>'+l.fisicoQtd+'</td>'+
      '<td>'+(l.emprestado>0?'+':'')+l.emprestado+'</td>'+
      '<td>'+(l.devendo>0?'-'+l.devendo:l.devendo)+'</td>'+
      '<td style="font-weight:700;">'+l.patrimonio+'</td></tr>'
    ).join('')).join('')+
    '</tbody><tfoot><tr style="font-weight:700;"><td colspan="2">Total '+titulo+'</td>'+
    '<td>'+soma('fisicoQtd')+'</td><td>'+soma('emprestado')+'</td><td>'+soma('devendo')+'</td><td>'+soma('patrimonio')+'</td></tr></tfoot>'+
    '</table></div>';
}
function relatorioPatrimonio(){
  const linhasGas = ITENS_GAS_COMODATO.map(t=>linhaPatrimonioItem('gas', t, t));
  const linhasAgua = ITENS_AGUA_COMODATO.map(p=>linhaPatrimonioItem('agua', p[1], p[0]));
  return '<h3>Patrimônio real (o que é realmente nosso)</h3>'+
    '<div class="hint">Junta o estoque físico da loja com o que está emprestado com clientes (continua sendo nosso, só está fora) e desconta o que devemos ao atacadista (está com a gente, mas não é nosso). Cheio e vazio são contados separadamente, em unidades — não em kg ou R$.</div>'+
    tabelaPatrimonioGrupo('Gás', linhasGas) +
    tabelaPatrimonioGrupo('Água', linhasAgua);
}

function parseNumeroPlanilha(v){
  if(v==null || v==='') return 0;
  if(typeof v==='number') return v;
  let s = String(v).trim().replace(/[^\d.,\-]/g,'');
  if(!s) return 0;
  const neg = s.startsWith('-');
  if(neg) s = s.slice(1);
  const hasComma = s.includes(','), hasDot = s.includes('.');
  if(hasComma && hasDot){ s = s.replace(/\./g,'').replace(',', '.'); }
  else if(hasComma && !hasDot){ s = s.replace(',', '.'); }
  else if(hasDot){
    const partes = s.split('.');
    if(partes.length>2){ const dec = partes.pop(); s = partes.join('')+'.'+dec; }
  }
  const n = Number(s);
  if(isNaN(n)) return 0;
  return neg ? -n : n;
}

function renderHistoricoMapping(headers, linhas){
  const wrap = document.getElementById('historico-mapping');
  if(!wrap) return;
  if(!headers || headers.length<2){ wrap.innerHTML = '<div class="empty">Não encontrei colunas suficientes nessa planilha (a primeira coluna precisa ser o mês).</div>'; return; }
  const colMes = headers[0];
  const registros = linhas.map(function(r){
    const mesTxt = r[colMes];
    let mesChave = normalizarDataImportada(mesTxt, '');
    if(!mesChave){
      const ym = String(mesTxt||'').match(/(\d{4})[-\/](\d{1,2})/);
      if(ym) mesChave = ym[1]+'-'+ym[2].padStart(2,'0')+'-01';
      else { const y = String(mesTxt||'').match(/(\d{4})/); mesChave = y ? y[1]+'-01-01' : ''; }
    }
    const dados = {};
    headers.slice(1).forEach(h=>{
      const v = r[h];
      if(v!=null && v!==''){ dados[h] = parseNumeroPlanilha(v); }
    });
    return {mes: mesChave.slice(0,7), dados: dados};
  }).filter(r=>r.mes);
  if(registros.length===0){
    wrap.innerHTML = '<div class="empty">Não consegui identificar nenhum mês válido na primeira coluna dessa planilha.</div>';
    return;
  }
  wrap.innerHTML = '<div class="hint" style="margin-top:10px;">'+registros.length+' mês(es) encontrados: '+registros.map(r=>nomeMes(r.mes)).join(', ')+'</div>'+
    '<button class="btn small green" id="btn-importar-historico" style="margin-top:8px;">Importar '+registros.length+' mês(es)</button>';
  document.getElementById('btn-importar-historico').onclick = async ()=>{
    registros.forEach(function(reg){
      const idx = state.historicoMensal.findIndex(x=>x.mes===reg.mes);
      if(idx>-1) state.historicoMensal[idx] = reg; else state.historicoMensal.push(reg);
    });
    await save('historicoMensal');
    seriesEvolucaoSelecionadas = null;
    wrap.innerHTML = '';
    renderAll();
    alert(registros.length+' mês(es) importado(s)/atualizado(s) com sucesso!');
  };
}
function evolucaoMensalCompleta(){
  const colunas = colunasHistoricoDisponiveis();
  const chaveVendasCol = colunas.find(c=>/vendas/i.test(c));
  const chaveDespesasCol = colunas.find(c=>/despesas/i.test(c));
  const porMes = {};
  state.historicoMensal.forEach(h=>{ porMes[h.mes] = Object.assign({}, h.dados); });
  const mesesReais = new Set();
  state.vendas.forEach(v=>mesesReais.add(monthKey(v.data)));
  state.despesas.forEach(d=>mesesReais.add(monthKey(d.data)));
  mesesReais.forEach(function(mk){
    const base = porMes[mk] || {};
    if(chaveVendasCol) base[chaveVendasCol] = state.vendas.filter(v=>monthKey(v.data)===mk).reduce((s,v)=>s+v.valor_total,0);
    if(chaveDespesasCol) base[chaveDespesasCol] = state.despesas.filter(d=>monthKey(d.data)===mk).reduce((s,d)=>s+d.valor,0);
    porMes[mk] = base;
  });
  return porMes;
}

function renderEvolucaoMensalChart(){

  const cores = seriesCoresEvolucao();
  const usaEixoSecundario = seriesEvolucaoSelecionadas.some(s=>/vendas|despesas/i.test(s)) && seriesEvolucaoSelecionadas.some(s=>!/vendas|despesas/i.test(s));
  criarChart('chart-evolucao-mensal', {
    type:'line',
    data:{ labels: meses.map(nomeMes), datasets: seriesEvolucaoSelecionadas.map((serie,i)=>({
      label: serie, data: meses.map(m=>Number(porMes[m][serie])||0),
      borderColor: cores[i%cores.length], backgroundColor: cores[i%cores.length],
      fill:false, tension:0.25, borderWidth:2, pointRadius:3, pointBackgroundColor: cores[i%cores.length],
      yAxisID: (usaEixoSecundario && /vendas|despesas/i.test(serie)) ? 'y1' : 'y'
    })) },
    options:{ maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales: usaEixoSecundario ? {

      y1:{ beginAtZero:true, position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'R$'} }

function renderRelatorioItensResultado(){
  const de = document.getElementById('ri-de').value, ate = document.getElementById('ri-ate').value;
  const gruposSel = Array.from(document.querySelectorAll('.ri-grupo:checked')).map(c=>c.value);
  const tiposSel = Array.from(document.querySelectorAll('.ri-tipo:checked')).map(c=>c.value);
  const produtosSel = Array.from(document.querySelectorAll('.ri-produto:checked')).map(c=>c.value);
  const wrap = document.getElementById('ri-resultado');
  if(gruposSel.length===0 && tiposSel.length===0 && produtosSel.length===0){
    wrap.innerHTML = '<div class="empty">Selecione ao menos uma categoria, tipo ou produto para contar.</div>';
    return;
  }
  const filtradas = state.vendas.filter(function(v){
    if(v.data<de || v.data>ate) return false;
    if(gruposSel.length>0 && !gruposSel.includes(grupoDaCategoria(v.categoria))) return false;
    if(tiposSel.length>0 && !tiposSel.includes(v.categoria)) return false;
    if(produtosSel.length>0 && !produtosSel.includes(v.produto)) return false;
    return true;
  });
  const totalQtd = filtradas.reduce((s,v)=>s+v.quantidade,0);
  const totalValor = filtradas.reduce((s,v)=>s+v.valor_total,0);
  const porCategoria = {};
  filtradas.forEach(v=>{
    if(!porCategoria[v.categoria]) porCategoria[v.categoria] = {qtd:0, valor:0};
    porCategoria[v.categoria].qtd += v.quantidade;
    porCategoria[v.categoria].valor += v.valor_total;
  });
  const linhas = Object.entries(porCategoria).sort((a,b)=>b[1].qtd-a[1].qtd);
  wrap.innerHTML =
    '<div class="grid cols2" style="margin-bottom:12px;">'+
    '<div class="metric"><div class="label">Itens vendidos (seleção atual)</div><div class="value">'+totalQtd+'</div></div>'+
    '<div class="metric"><div class="label">Valor total</div><div class="value">'+fmtMoney(totalValor)+'</div></div>'+
    '</div>'+
    (linhas.length===0?'<div class="empty">Nenhuma venda encontrada para essas categorias no período.</div>':
    '<div class="table-wrap"><table><thead><tr><th>Categoria</th><th>Quantidade</th><th>Valor total</th></tr></thead><tbody>'+
    linhas.map(l=>'<tr><td>'+l[0]+'</td><td>'+l[1].qtd+'</td><td>'+fmtMoney(l[1].valor)+'</td></tr>').join('')+
    '</tbody></table></div>');
}

function renderRelatorioEmpresasResultado(){

    state.convenioLancamentos.filter(c=>c.data>=de && c.data<=ate).forEach(c=>{ porEmpresa[c.empresa] = (porEmpresa[c.empresa]||0) + c.valor; });
