/* Anexa os handlers do formulário de lançamento manual e de pagamento (baixa) do convênio.
   É chamada sempre que renderRelatorioEmpresasResultado() recria o HTML, garantindo que os
   botões/forms recém-criados no DOM sempre tenham seus listeners — antes esses handlers só
   eram ligados dentro de attachHandlers(), ANTES do form existir no DOM (o form só é criado
   aqui dentro), então o clique caía no envio padrão do <form> (recarregando a página) e nada
   era salvo. */
function attachConvenioHandlers(){
  const fConvenio = document.getElementById('form-convenio');
  if(fConvenio) fConvenio.onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(fConvenio);
    const empresaSel = document.getElementById('re-empresa').value;
    relEmpresaSel = empresaSel;
    relEmpresaDe = document.getElementById('re-de').value;
    relEmpresaAte = document.getElementById('re-ate').value;
    const valorConvenio = parseValorBR(f.get('valor'));
    if(!f.get('valor') || isNaN(valorConvenio) || valorConvenio<=0){
      alert('Digite um valor válido, por exemplo 50,00');
      return;
    }
    if(editConvenioId){
      const ci = state.convenioLancamentos.find(x=>x.id===editConvenioId);
      if(ci){ ci.valor=valorConvenio; ci.data=f.get('data'); ci.descricao=f.get('descricao')||''; }
      editConvenioId = null;
    } else {
      state.convenioLancamentos.push({id:uid(), empresa:empresaSel, valor:valorConvenio, data:f.get('data'), descricao:f.get('descricao')||''});
    }
    const ok = await save('convenioLancamentos');
    if(!ok) return;
    renderAll();
  };
  document.querySelectorAll('[data-edit-convenio]').forEach(btn=>btn.onclick=()=>{
    const ci = state.convenioLancamentos.find(x=>x.id===btn.dataset.editConvenio);
    if(!ci) return;
    editConvenioId = ci.id;
    const form = document.getElementById('form-convenio');
    if(form){ form.data.value=ci.data; form.valor.value=Number(ci.valor).toFixed(2).replace('.', ','); form.descricao.value=ci.descricao||''; form.scrollIntoView({behavior:'smooth'}); }
  });
  document.querySelectorAll('[data-del-convenio]').forEach(btn=>btn.onclick=async()=>{
    if(!confirm('Excluir este lançamento?')) return;
    relEmpresaSel = document.getElementById('re-empresa').value;
    relEmpresaDe = document.getElementById('re-de').value;
    relEmpresaAte = document.getElementById('re-ate').value;
    state.convenioLancamentos = state.convenioLancamentos.filter(x=>x.id!==btn.dataset.delConvenio);
    const ok = await save('convenioLancamentos');
    if(!ok) return;
    renderAll();
  });
  const fPag = document.getElementById('form-convenio-pag');
  if(fPag) fPag.onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(fPag);
    const empresaSel = document.getElementById('re-empresa').value;
    relEmpresaSel = empresaSel;
    relEmpresaDe = document.getElementById('re-de').value;
    relEmpresaAte = document.getElementById('re-ate').value;
    const valorPag = parseValorBR(f.get('valor'));
    if(!f.get('valor') || isNaN(valorPag) || valorPag<=0){
      alert('Digite um valor válido, por exemplo 50,00');
      return;
    }
    if(!state.convenioPagamentos) state.convenioPagamentos = [];
    if(editConvenioPagamentoId){
      const p = state.convenioPagamentos.find(x=>x.id===editConvenioPagamentoId);
      if(p){ p.valor=valorPag; p.data=f.get('data'); p.forma_pagamento=f.get('forma_pagamento')||''; }
      editConvenioPagamentoId = null;
    } else {
      state.convenioPagamentos.push({id:uid(), empresa:empresaSel, valor:valorPag, data:f.get('data'), forma_pagamento:f.get('forma_pagamento')||''});
    }
    const ok = await save('convenioPagamentos');
    if(!ok) return;
    renderAll();
  };
  document.querySelectorAll('[data-edit-convenio-pag]').forEach(btn=>btn.onclick=()=>{
    const p = (state.convenioPagamentos||[]).find(x=>x.id===btn.dataset.editConvenioPag);
    if(!p) return;
    editConvenioPagamentoId = p.id;
    const form = document.getElementById('form-convenio-pag');
    if(form){ form.data.value=p.data; form.valor.value=Number(p.valor).toFixed(2).replace('.', ','); form.forma_pagamento.value=p.forma_pagamento||'Pix'; form.scrollIntoView({behavior:'smooth'}); }
  });
  document.querySelectorAll('[data-del-convenio-pag]').forEach(btn=>btn.onclick=async()=>{
    if(!confirm('Excluir este pagamento?')) return;
    relEmpresaSel = document.getElementById('re-empresa').value;
    relEmpresaDe = document.getElementById('re-de').value;
    relEmpresaAte = document.getElementById('re-ate').value;
    state.convenioPagamentos = (state.convenioPagamentos||[]).filter(x=>x.id!==btn.dataset.delConvenioPag);
    const ok = await save('convenioPagamentos');
    if(!ok) return;
    renderAll();
  });
}
async function carregarAnexosConvenio(empresa, mes){
  try{
    const {data,error} = await supabaseClient.from('app_data').select('valor').eq('chave','anexo:'+empresa+':'+mes).single();
    if(error||!data) return [];
    return data.valor||[];
  }catch(e){ return []; }
}
async function salvarAnexosConvenio(empresa, mes, lista){
  await supabaseClient.from('app_data').upsert({chave:'anexo:'+empresa+':'+mes, valor:lista, atualizado_em:new Date().toISOString()},{onConflict:'chave'});
}
async function carregarERenderizarAnexos(empresa, mes){
  const lista = await carregarAnexosConvenio(empresa, mes);
  window.__anexosConvenioAtual = {empresa, mes, lista};
  const box = document.getElementById('re-anexos-lista');
  if(!box) return;
  if(lista.length===0){ box.innerHTML = '<div class="empty">Nenhum anexo ainda esse mês.</div>'; return; }
  box.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Arquivo</th><th>Tipo</th><th></th></tr></thead><tbody>'+
    lista.map(a=>'<tr><td>'+a.nome+'</td><td>'+(a.tipo==='pdf'?'PDF':'Foto')+'</td><td><button class="del-link" data-del-anexo="'+a.id+'">🗑 excluir</button></td></tr>').join('')+
    '</tbody></table></div>';
}
function comprimirImagemArquivo(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1400;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function lerArquivoComoDataURL(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>resolve(ev.target.result);
    reader.readAsDataURL(file);
  });
}
async function gerarPdfConvenio(empresa, de, ate, vendas, anexos){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdf = await PDFDocument.create();
  const font = await pdf.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdf.embedFont(StandardFonts.HelveticaBold);
  let page = pdf.addPage([595,842]);
  let y = 800;
  const linha = (texto, tamanho, negrito)=>{
    if(y<50){ page = pdf.addPage([595,842]); y = 800; }
    page.drawText(texto, {x:40, y, size:tamanho||11, font: negrito?fontBold:font, color:rgb(0.1,0.1,0.15)});
    y -= (tamanho||11)+8;
  };
  linha('Relatório de Convênio — '+empresa, 16, true);
  linha('Período: '+fmtDate(de)+' a '+fmtDate(ate), 11);
  y -= 6;
  const total = vendas.reduce((s,v)=>s+v.valor_total,0);
  linha('Total do período: '+fmtMoney(total), 13, true);
  y -= 10;
  linha('Data        Produto                          Cliente                  Valor', 10, true);
  vendas.forEach(v=>{
    const l = fmtDate(v.data)+'  '+(v.categoria||'').padEnd(30).slice(0,30)+' '+(v.cliente||'—').padEnd(22).slice(0,22)+' '+fmtMoney(v.valor_total);
    linha(l, 9.5);
  });
  for(const anexo of anexos){
    if(anexo.tipo==='pdf'){
      try{
        const src = await PDFDocument.load(anexo.dataUrl);
        const paginas = await pdf.copyPages(src, src.getPageIndices());
        paginas.forEach(p=>pdf.addPage(p));
      }catch(e){ console.error('Erro ao anexar PDF', anexo.nome, e); }
    } else {
      try{
        const img = anexo.dataUrl.includes('image/png') ? await pdf.embedPng(anexo.dataUrl) : await pdf.embedJpg(anexo.dataUrl);
        const p = pdf.addPage([595,842]);
        const escala = Math.min(515/img.width, 780/img.height, 1);
        const w = img.width*escala, h = img.height*escala;
        p.drawImage(img, {x:(595-w)/2, y:(842-h)/2, width:w, height:h});
      }catch(e){ console.error('Erro ao anexar imagem', anexo.nome, e); }
    }
  }
  const bytes = await pdf.save();
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'convenio-'+empresa.replace(/\s+/g,'-')+'-'+monthKey(de)+'.pdf';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- HANDLERS ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-ajuda-toggle]').forEach(btn=>btn.onclick=()=>{
    const el = document.getElementById('ajuda-'+btn.dataset.ajudaToggle);
    if(el) el.style.display = el.style.display==='none' ? 'block' : 'none';
  });
  seletorVendaMain = wireSeletorCategoria({
    grupoId:'sel-grupo', etiquetaWrapId:'wrap-etiqueta', etiquetaId:'sel-etiqueta',
    produtoWrapId:'wrap-produto', produtoId:'sel-produto-catalogo', categoriaHiddenId:'sel-categoria',
    manualWrapId:'wrap-produto-manual',
    produtoLivreEl: document.querySelector('input[name="produto_livre"]'),
    valorUnitEl: document.querySelector('input[name="valor_unit"]')
  });

  if(fvPre && prefillVenda){

    if(prefillVenda.quantidade) fvPre.quantidade.value = prefillVenda.quantidade;
    if(prefillVenda.tipo_entrega) fvPre.tipo_entrega.value = prefillVenda.tipo_entrega;
    if(prefillVenda.empresa) fvPre.empresa.value = prefillVenda.empresa;
    if(prefillVenda.entrega_data) fvPre.entrega_data.value = prefillVenda.entrega_data;
    if(prefillVenda.entrega_hora) fvPre.entrega_hora.value = prefillVenda.entrega_hora;
    if(prefillVenda.obs) fvPre.obs.value = prefillVenda.obs;
    if(prefillVenda.pagamento) fvPre.pagamento.value = prefillVenda.pagamento;
    if(prefillVenda.frete) fvPre.frete.value = prefillVenda.frete;
    if(prefillVenda.categoria && seletorVendaMain) seletorVendaMain.setValor(prefillVenda.categoria, prefillVenda.produto_livre);
    prefillVenda = null;
  }
  const btnNovaCatProduto = document.getElementById('btn-nova-cat-produto');
  if(btnNovaCatProduto) btnNovaCatProduto.onclick = ()=>{ document.getElementById('nova-cat-produto-wrap').style.display='block'; };
  const btnAddCatProduto = document.getElementById('btn-add-cat-produto');
  if(btnAddCatProduto) btnAddCatProduto.onclick = async ()=>{
    const val = document.getElementById('nova-cat-produto-input').value.trim();
    if(!val) return;
    if(categoriaControladaEquivalente(val)){ alert('Isso parece um item de gás ou água, que já é controlado automaticamente pelo estoque — escolha Categoria = Gás ou Água no formulário em vez de criar um tipo novo.'); return; }
    if(!state.categoriasProdutos.includes(val)) state.categoriasProdutos.push(val);
    await save('categoriasProdutos');
    renderAll();
  };
  const btnNovaCatDespesa = document.getElementById('btn-nova-cat-despesa');
  if(btnNovaCatDespesa) btnNovaCatDespesa.onclick = ()=>{ document.getElementById('nova-cat-despesa-wrap').style.display='block'; };
  const btnAddCatDespesa = document.getElementById('btn-add-cat-despesa');
  if(btnAddCatDespesa) btnAddCatDespesa.onclick = async ()=>{
    const val = document.getElementById('nova-cat-despesa-input').value.trim();
    if(!val) return;
    if(!state.categoriasDespesas.includes(val)) state.categoriasDespesas.push(val);
    await save('categoriasDespesas');
    renderAll();
  };

  /* ---- Gerenciar categorias (Configurações) ---- */
  const btnAddCatProdutoConfig = document.getElementById('btn-add-cat-produto-config');
  if(btnAddCatProdutoConfig) btnAddCatProdutoConfig.onclick = async ()=>{
    const inp = document.getElementById('nova-cat-produto-config-input');
    const selGrupo = document.getElementById('nova-cat-produto-config-grupo');
    const val = inp.value.trim();
    const grupo = selGrupo && selGrupo.value ? selGrupo.value : 'outros';
    if(!val) return;
    if(state.categoriasProdutos.includes(val)){ alert('Já existe uma categoria de produto com esse nome.'); return; }
    if(categoriaControladaEquivalente(val)){ alert('Isso parece um item de gás ou água, que já é controlado automaticamente pelo estoque — não crie uma categoria separada pra ele. Se o preço estiver errado, edite direto na seção "Gás e água" da aba Produtos.'); return; }
    state.categoriasProdutos.push(val);
    if(!state.categoriasProdutosGrupo) state.categoriasProdutosGrupo = {};
    state.categoriasProdutosGrupo[val] = grupo;
    await save('categoriasProdutos'); await save('categoriasProdutosGrupo');
    renderAll();
  };
  document.querySelectorAll('[data-edit-cat-produto]').forEach(btn=>btn.onclick=()=>{
    editCategoriaProdutoNome = btn.dataset.editCatProduto;
    renderAll();
  });
  document.querySelectorAll('[data-cancel-cat-produto]').forEach(btn=>btn.onclick=()=>{
    editCategoriaProdutoNome = null;
    renderAll();
  });
  document.querySelectorAll('[data-save-cat-produto]').forEach(btn=>btn.onclick=async()=>{
    const oldName = btn.dataset.saveCatProduto;
    const inp = document.getElementById('input-edit-cat-produto');
    const newName = inp ? inp.value.trim() : '';
    if(!newName) return;
    if(newName!==oldName && state.categoriasProdutos.includes(newName)){ alert('Já existe uma categoria com esse nome.'); return; }
    if(newName!==oldName){
      renomearCategoriaProduto(oldName, newName);
      await save('categoriasProdutos'); await save('produtos'); await save('vendas'); await save('agendamentos');
    }
    editCategoriaProdutoNome = null;
    renderAll();
  });
  document.querySelectorAll('[data-del-cat-produto]').forEach(btn=>btn.onclick=async()=>{
    const cat = btn.dataset.delCatProduto;
    const qtd = produtosDaCategoria(cat).length;
    const msg = qtd>0
      ? 'Essa categoria tem '+qtd+' produto(s) cadastrados. Excluir a categoria também vai excluir esses produtos do catálogo (vendas já registradas não serão afetadas). Deseja continuar?'
      : 'Excluir a categoria "'+cat+'"?';
    if(!confirm(msg)) return;
    state.categoriasProdutos = state.categoriasProdutos.filter(c=>c!==cat);
    state.produtos = state.produtos.filter(p=>p.categoria!==cat);
    if(state.categoriasProdutosGrupo) delete state.categoriasProdutosGrupo[cat];
    await save('categoriasProdutos'); await save('produtos'); await save('categoriasProdutosGrupo');
    renderAll();
  });

  const btnAddCatDespesaConfig = document.getElementById('btn-add-cat-despesa-config');
  if(btnAddCatDespesaConfig) btnAddCatDespesaConfig.onclick = async ()=>{
    const inp = document.getElementById('nova-cat-despesa-config-input');
    const val = inp.value.trim();
    if(!val) return;
    if(state.categoriasDespesas.includes(val)){ alert('Já existe uma categoria de despesa com esse nome.'); return; }
    state.categoriasDespesas.push(val);
    await save('categoriasDespesas');
    renderAll();
  };
  document.querySelectorAll('[data-edit-cat-despesa]').forEach(btn=>btn.onclick=()=>{
    editCategoriaDespesaNome = btn.dataset.editCatDespesa;
    renderAll();
  });
  document.querySelectorAll('[data-cancel-cat-despesa]').forEach(btn=>btn.onclick=()=>{
    editCategoriaDespesaNome = null;
    renderAll();
  });
  document.querySelectorAll('[data-save-cat-despesa]').forEach(btn=>btn.onclick=async()=>{
    const oldName = btn.dataset.saveCatDespesa;
    const inp = document.getElementById('input-edit-cat-despesa');
    const newName = inp ? inp.value.trim() : '';
    if(!newName) return;
    if(newName!==oldName && state.categoriasDespesas.includes(newName)){ alert('Já existe uma categoria com esse nome.'); return; }
    if(newName!==oldName){
      renomearCategoriaDespesa(oldName, newName);
      await save('categoriasDespesas'); await save('despesas');
    }
    editCategoriaDespesaNome = null;
    renderAll();
  });
  document.querySelectorAll('[data-del-cat-despesa]').forEach(btn=>btn.onclick=async()=>{
    const cat = btn.dataset.delCatDespesa;
    const qtd = despesasDaCategoria(cat).length;
    const msg = qtd>0
      ? 'Essa categoria tem '+qtd+' despesa(s) registradas. Elas vão manter o nome antigo no histórico, mas a categoria não vai aparecer mais para novos lançamentos. Deseja continuar?'
      : 'Excluir a categoria "'+cat+'"?';
    if(!confirm(msg)) return;
    state.categoriasDespesas = state.categoriasDespesas.filter(c=>c!==cat);
    await save('categoriasDespesas');
    renderAll();
  });

  const btnUnificarDuplicados = document.getElementById('btn-unificar-duplicados');
  if(btnUnificarDuplicados) btnUnificarDuplicados.onclick = async ()=>{
    if(!confirm('Isso vai juntar categorias e produtos com nomes repetidos (ignorando maiúsculas, acentos e espaços). Não pode ser desfeito. Continuar?')) return;
    const catsProdUnificadas = mesclarCategoriasDuplicadas();
    const catsDespUnificadas = mesclarCategoriasDespesasDuplicadas();
    const produtosUnificados = mesclarProdutosDuplicados();
    await save('categoriasProdutos'); await save('produtos'); await save('vendas'); await save('agendamentos');
    await save('categoriasDespesas'); await save('despesas');
    alert('Pronto! '+catsProdUnificadas+' categoria(s) de produto, '+catsDespUnificadas+' categoria(s) de despesa e '+produtosUnificados+' produto(s) duplicados foram unificados.');
    renderAll();
  };
  const btnExcluirCatDuplicadasEstoque = document.getElementById('btn-excluir-cat-duplicadas-estoque');
  if(btnExcluirCatDuplicadasEstoque) btnExcluirCatDuplicadasEstoque.onclick = async ()=>{
    const selecionadas = Array.from(document.querySelectorAll('.chk-cat-duplicada:checked')).map(el=>el.value);
    if(selecionadas.length===0){ alert('Selecione ao menos uma categoria.'); return; }
    const totalProdutos = selecionadas.reduce((s,c)=>s+produtosDaCategoria(c).length,0);
    if(!confirm('Isso vai excluir '+selecionadas.length+' categoria(s) e '+totalProdutos+' produto(s) do catálogo, mantendo só o controle de estoque nativo de gás/água. Vendas já registradas não são afetadas. Confirma?')) return;
    state.categoriasProdutos = state.categoriasProdutos.filter(c=>!selecionadas.includes(c));
    state.produtos = state.produtos.filter(p=>!selecionadas.includes(p.categoria));
    if(state.categoriasProdutosGrupo) selecionadas.forEach(c=>{ delete state.categoriasProdutosGrupo[c]; });
    await save('categoriasProdutos'); await save('produtos'); await save('categoriasProdutosGrupo');
    alert('Categorias e produtos removidos. O estoque de gás e água continua controlado normalmente pela aba Estoque.');
    renderAll();
  };
  const btnExcluirTodosProdutos = document.getElementById('btn-excluir-todos-produtos');
  if(btnExcluirTodosProdutos) btnExcluirTodosProdutos.onclick = async ()=>{
    const qtd = state.produtos.filter(p=>!CATEGORIAS_CONTROLADAS.includes(p.categoria)).length;
    if(qtd===0){ alert('Não há produtos pra excluir — o catálogo já só tem gás e água.'); return; }
    if(!confirm('Isso vai excluir '+qtd+' produto(s) do catálogo, mantendo gás e água intactos. As categorias continuam cadastradas. Continuar?')) return;
    if(!confirm('Tem certeza mesmo? Essa ação não pode ser desfeita.')) return;
    state.produtos = state.produtos.filter(p=>CATEGORIAS_CONTROLADAS.includes(p.categoria));
    await save('produtos');
    alert('Produtos excluídos. As categorias e o controle de estoque de gás/água continuam intactos.');
    renderAll();
  };

  const fv = document.getElementById('form-venda');
  if(fv) fv.onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(fv);
    const categoria = f.get('categoria');
    const controlada = isControlada(categoria);
    const produto = controlada ? categoria : (f.get('produto_livre')||'(sem nome)');
    const quantidade = Number(f.get('quantidade'));
    const valor_unit = Number(f.get('valor_unit'));
    const valor_total = Math.round(quantidade*valor_unit*100)/100;
    if(editVendaId){
      const v = state.vendas.find(x=>x.id===editVendaId);
      if(v){
        ajustaEstoquePorVenda(v.categoria, v.quantidade, true);
        v.data=f.get('data'); v.cliente=f.get('cliente')||''; v.canal=f.get('canal');
        v.categoria=categoria; v.produto=produto; v.quantidade=quantidade; v.valor_unit=valor_unit; v.valor_total=valor_total;
        v.pagamento=f.get('pagamento'); v.nota=f.get('nota'); v.tipo_entrega=f.get('tipo_entrega');
        v.empresa=f.get('empresa')||''; v.entrega_data=f.get('entrega_data')||(f.get('entrega_hora')?f.get('data'):''); v.entrega_hora=f.get('entrega_hora')||''; v.obs=f.get('obs')||'';

  document.querySelectorAll('[data-edit-comunicado]').forEach(btn=>btn.onclick=()=>{
    editComunicadoId = btn.dataset.editComunicado;
    renderAll();
  });
  document.querySelectorAll('[data-del-comunicado]').forEach(btn=>btn.onclick=async()=>{

      atualizarSinoBadge();
      renderAll();
    }
  });
  const formComunicado = document.getElementById('form-comunicado');
  if(formComunicado) formComunicado.onsubmit = async(e)=>{
    e.preventDefault();

    const texto = f.get('texto')||'';
    const ativo = formComunicado.querySelector('[name="ativo"]').checked;
    const fileInput = document.getElementById('comunicado-imagem-input');
    const file = fileInput && fileInput.files[0];
    const salvarComImagem = (imagemUrl)=>{
      if(editComunicadoId){
        const c = state.comunicados.find(x=>x.id===editComunicadoId);
        if(c){ c.titulo=titulo; c.texto=texto; c.ativo=ativo; if(imagemUrl) c.imagemUrl=imagemUrl; }
        editComunicadoId = null;
      } else {
        state.comunicados.push({id:uid(), criadoEm:Date.now(), titulo, texto, ativo, imagemUrl: imagemUrl||''});
      }
      save('comunicados').then(()=>{ atualizarSinoBadge(); renderAll(); });
    };
    if(file){
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 900;
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width*scale; canvas.height = img.height*scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          salvarComImagem(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      salvarComImagem(null);
    }
  };
}

function detectDelimiter(line){
  const candidates = ['\t', ';', ','];
  let best = candidates[0], bestCount = -1;
  candidates.forEach(d=>{
    const c = line.split(d).length;
    if(c>bestCount){ bestCount=c; best=d; }
  });
  return best;
}
function parseDelimitedLine(line, delim){
  const cells = []; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch==='"'){
      if(inQuotes && line[i+1]==='"'){ cur+='"'; i++; }
      else inQuotes = !inQuotes;
    } else if(ch===delim && !inQuotes){
      cells.push(cur.trim()); cur='';
    } else { cur+=ch; }
  }
  cells.push(cur.trim());
  return cells.map(c=>c.replace(/^"|"$/g,''));
}
function guessHeader(headers, keywords){
  const h = headers.find(h=>keywords.some(k=>h.toLowerCase().includes(k)));
  return h || headers[0];
}
function celulaParaTexto(v){
  if(v==null) return '';
  if(v instanceof Date){
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,'0'), d=String(v.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+d;
  }
  return String(v);
}
function linhasParaObjetos(headers, linhas){
  return linhas.map(function(cells){
    const obj = {};
    headers.forEach((h,i)=>obj[h]=celulaParaTexto(cells[i]));
    return obj;
  });
}

function processarImportacaoDiariaExcel(file){
  if(typeof XLSX==='undefined'){ alert('Não consegui carregar a biblioteca de Excel. Confira sua conexão com a internet e tente de novo.'); return; }
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    let wb;
    try{
      wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:true});
    }catch(e){
      alert('Não consegui ler esse arquivo Excel. Detalhe: '+(e && e.message ? e.message : e));
      return;
    }
    const lerAba = function(nome){
      const nomeReal = wb.SheetNames.find(n=>chaveNormalizada(n)===chaveNormalizada(nome));
      if(!nomeReal) return [];
      const ws = wb.Sheets[nomeReal];
      const matriz = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, dateNF:'yyyy-mm-dd', blankrows:false});
      if(!matriz || matriz.length<2) return [];
      const headers = matriz[0].map(h=>String(h||'').trim());
      const linhas = matriz.slice(1).filter(l=>l.some(c=>c!=null && String(c).trim()!==''));
      return linhasParaObjetos(headers, linhas);
    };
    const linhasVendas = lerAba('Vendas');
    const linhasDespesas = lerAba('Despesas');
    const linhasClientes = lerAba('Clientes');
    const linhasProdutos = lerAba('Produtos');
    if(linhasVendas.length+linhasDespesas.length+linhasClientes.length+linhasProdutos.length===0){
      alert('Não encontrei nenhuma linha preenchida nas abas Vendas, Despesas, Clientes ou Produtos desse arquivo.');
      return;
    }
    const pendentesProdutos = detectarProdutosPendentesVendas(linhasVendas);
    const pendentesClientes = detectarClientesPendentesVendas(linhasVendas);
    if(pendentesProdutos.length>0 || pendentesClientes.length>0){
      mostrarResolucaoProdutosImportacaoDiaria(pendentesProdutos, pendentesClientes, linhasVendas, linhasDespesas, linhasClientes, linhasProdutos);
      return;
    }
    await continuarImportacaoDiaria(linhasVendas, linhasDespesas, linhasClientes, linhasProdutos);
  };
  reader.readAsArrayBuffer(file);
}
async function continuarImportacaoDiaria(linhasVendas, linhasDespesas, linhasClientes, linhasProdutos){
    const resumo = [];
    const hoje = todayStr();
    const nomesClientesExistentes = new Set(state.clientes.map(c=>chaveNormalizada(c.nome)));

    if(linhasVendas.length){
      let importadas=0, ignoradas=0, clientesNovosDeVendas=0, creditosAlterados=false, fiadosGeradosPorAbate=0;
      const gruposPorChaveVenda = new Map();
      linhasVendas.forEach(function(r){
        const textoCategoria = (r['Categoria/Produto']||'').trim();
        if(!textoCategoria){ ignoradas++; return; }
        const chaveTexto = chaveNormalizada(textoCategoria);
        const categoriaExistente = state.categoriasProdutos.find(c=>chaveNormalizada(c)===chaveTexto);
        let categoria = categoriaExistente;
        let categoriaEhNova = false;
        if(!categoria){
          const resolvido = resolucaoProdutosImportacaoDiaria[chaveTexto];
          if(resolvido && resolvido.acao==='existente'){
            categoria = resolvido.categoria;
          } else if(categoriaControladaEquivalente(textoCategoria)){ ignoradas++; return; }
          else {
            categoria = textoCategoria;
            if(!state.categoriasProdutos.includes(categoria)) state.categoriasProdutos.push(categoria);
            categoriaEhNova = true;
          }
        }
        const controlada = isControlada(categoria);
        const produto = controlada ? categoria : textoCategoria;
        const quantidade = r['Quantidade'] ? (Number(String(r['Quantidade']).replace(',','.'))||1) : 1;
        const valor_unit = r['Valor Unitário'] ? (Number(String(r['Valor Unitário']).replace(/\./g,'').replace(',','.'))||0) : 0;
        if(categoriaEhNova && !controlada){
          const jaTemNoCatalogo = state.produtos.find(p=>chaveNormalizada(p.nome)===chaveNormalizada(produto) && chaveNormalizada(p.categoria)===chaveNormalizada(categoria));
          if(!jaTemNoCatalogo) state.produtos.push({id:uid(), nome:produto, categoria, preco:valor_unit, ativo:true});
        }
        const valor_total = Math.round(quantidade*valor_unit*100)/100;
        const data = r['Data'] ? normalizarDataImportada(r['Data'], hoje) : hoje;
        let cliente = (r['Cliente']||'').trim();
        if(cliente){
          const chaveCliente = chaveNormalizada(cliente);
          const resolvidoCliente = resolucaoClientesImportacaoDiaria[chaveCliente];
          if(resolvidoCliente && resolvidoCliente.acao==='existente'){
            cliente = resolvidoCliente.nome;
            nomesClientesExistentes.add(chaveCliente);
          } else if(!nomesClientesExistentes.has(chaveCliente)){
            nomesClientesExistentes.add(chaveCliente);
            state.clientes.push({
              id: uid(), nome: cliente,
              telefone: (r['Telefone Cliente']||'').trim(),
              endereco: (r['Endereço Cliente']||'').trim(),
              complemento: (r['Complemento Cliente']||'').trim(),
              obs: ''
            });
            clientesNovosDeVendas++;
          }
        }
        const canal = (r['Canal']||'').trim() || CANAIS[0];
        const pagamento = (r['Forma de Pagamento']||'').trim() || PAGAMENTOS[0];
        const nota = (r['Nota']||'').trim() || 'Não lança';
        const tipo_entrega = (r['Tipo de Entrega']||'').trim() || TIPOS_ENTREGA[0];
        const empresa = (r['Empresa Convênio']||'').trim();
        const obs = (r['Observação']||'').trim();

        // Agrupa linhas da mesma compra (ex.: gás + água na mesma venda) pra contar como
        // um único "carrinho" no ticket médio: usa o Nº da Venda quando preenchido, ou
        // cliente+data como segunda opção. Sem nenhum dos dois, cada linha fica separada.
        const numeroVenda = (r['Nº da Venda']||'').trim();
        const chaveGrupo = numeroVenda ? ('num:'+numeroVenda) : (cliente ? ('cli:'+data+':'+chaveNormalizada(cliente)) : null);
        let grupoId, primeiraLinhaDoGrupo = true;
        if(chaveGrupo){
          if(gruposPorChaveVenda.has(chaveGrupo)){ grupoId = gruposPorChaveVenda.get(chaveGrupo); primeiraLinhaDoGrupo = false; }
          else { grupoId = uid(); gruposPorChaveVenda.set(chaveGrupo, grupoId); }
        } else { grupoId = uid(); }
        const freteBruto = TIPOS_ENTREGA_COM_FRETE.includes(tipo_entrega) ? (Number(String(r['Frete']||'0').replace(',','.'))||0) : 0;
        const frete = primeiraLinhaDoGrupo ? freteBruto : 0;
        const venda = {
          id: uid(), criadoEm: Date.now(), grupoId, fiado_pago:false,
          data, cliente, canal, categoria, produto, quantidade, valor_unit, valor_total,
          pagamento, nota, tipo_entrega, empresa, frete,
          entrega_data:'', entrega_hora:'', entrega_status:'', obs: obs || 'Importado de planilha'
        };
        state.vendas.push(venda);
        ajustaEstoquePorVenda(categoria, quantidade, false);
        importadas++;

        // Se a planilha marcou a venda como "Abateu", desconta automaticamente do crédito em
        // haver do cliente (igual ao lançamento manual) e, se sobrar diferença, lança de fiado —
        // sem precisar escolher nada na hora de importar.
        if(pagamento==='Abateu' && cliente){
          const totalVendaComFrete = Math.round((valor_total+frete)*100)/100;
          const saldoAntes = saldoCreditoCliente(cliente);
          const abatido = Math.round(Math.min(Math.max(saldoAntes,0), totalVendaComFrete)*100)/100;
          const diferenca = Math.round((totalVendaComFrete-abatido)*100)/100;
          state.creditos.push({id:uid(), cliente:cliente, valor:-abatido, data:data,
            obs:'Abatido na venda de '+fmtMoney(totalVendaComFrete)+(diferenca>0.004?' (diferença de '+fmtMoney(diferenca)+' foi pro fiado)':'')+' — importado de planilha'});
          creditosAlterados = true;
          if(diferenca>0.004){
            state.fiados.push({id:uid(), cliente:cliente, valor:diferenca, data:data,
              descricao:'Diferença da venda de '+fmtMoney(totalVendaComFrete)+' (parte paga com crédito em haver — importado de planilha)', status:'aberto'});
            venda.pagamento = 'Abateu + Fiado';
            fiadosGeradosPorAbate++;
          }
        }
      });
      if(importadas>0){ await save('vendas'); await save('estoque'); await save('categoriasProdutos'); await save('produtos'); if((state.pendenciasConferencia||[]).length) await save('pendenciasConferencia'); }
      if(clientesNovosDeVendas>0) await save('clientes');
      if(creditosAlterados) await save('creditos');
      if(fiadosGeradosPorAbate>0) await save('fiados');
      resumo.push(importadas+' venda(s) importada(s)'+(ignoradas>0?' — '+ignoradas+' ignorada(s) (sem categoria/produto válido)':''));
      if(clientesNovosDeVendas>0) resumo.push(clientesNovosDeVendas+' cliente(s) novo(s) cadastrado(s) a partir da aba Vendas');
      if(creditosAlterados) resumo.push('Crédito em haver abatido automaticamente nas vendas marcadas como "Abateu"'+(fiadosGeradosPorAbate>0?' ('+fiadosGeradosPorAbate+' com diferença lançada de fiado)':''));
    }

    if(linhasDespesas.length){
      let importadas=0, ignoradas=0;
      linhasDespesas.forEach(function(r){
        const valor = Number(String(r['Valor']||'0').replace(/\./g,'').replace(',','.'))||0;
        if(!valor || valor<=0){ ignoradas++; return; }
        const categoriaTxt = (r['Categoria']||'').trim();
        const categoriaExistente = state.categoriasDespesas.find(c=>chaveNormalizada(c)===chaveNormalizada(categoriaTxt));
        const categoria = categoriaExistente || categoriaTxt || state.categoriasDespesas[0];
        if(categoriaTxt && !categoriaExistente && !state.categoriasDespesas.includes(categoria)){state.categoriasDespesas.push(categoria);adicionarPendenciaConferencia('despesa','categoria',categoriaTxt,'Categoria não encontrada exatamente no cadastro; confira.');}
        const data = r['Data'] ? normalizarDataImportada(r['Data'], hoje) : hoje;
        const descricao = (r['Descrição']||'').trim();
        state.despesas.push({id:uid(), criadoEm:Date.now(), data, categoria, valor, descricao: descricao || 'Importado de planilha'});
        importadas++;
      });
      if(importadas>0){ await save('despesas'); await save('categoriasDespesas'); if((state.pendenciasConferencia||[]).length) await save('pendenciasConferencia'); }
      resumo.push(importadas+' despesa(s) importada(s)'+(ignoradas>0?' — '+ignoradas+' ignorada(s) (sem valor)':''));
    }

    if(linhasClientes.length){
      let novos=0, duplicados=0;
      linhasClientes.forEach(function(r){
        const nome = (r['Nome']||'').trim();
        if(!nome) return;
        const chave = chaveNormalizada(nome);
        if(nomesClientesExistentes.has(chave)){ duplicados++; return; }
        nomesClientesExistentes.add(chave);
        state.clientes.push({id:uid(), nome, telefone:(r['Telefone']||'').trim(), endereco:(r['Endereço']||'').trim(), complemento:(r['Complemento']||'').trim(), obs:(r['Observação']||'').trim()});
        novos++;
      });
      if(novos>0) await save('clientes');
      resumo.push(novos+' cliente(s) novo(s) cadastrado(s) a partir da aba Clientes'+(duplicados>0?' — '+duplicados+' já existiam':''));
    }

    if(linhasProdutos.length){
      let novos=0, ignorados=0;
      let categoriasGrupoAlterado = false;
      linhasProdutos.forEach(function(r){
        const nome = (r['Produto']||r['Nome']||'').trim();
        if(!nome){ ignorados++; return; }
        const categoria = (r['Categoria']||'').trim() || 'Outros';
        if(categoriaControladaEquivalente(nome) || categoriaControladaEquivalente(categoria)){ ignorados++; return; }
        const preco = Number(String(r['Preço']||'0').replace(/\./g,'').replace(',','.'))||0;
        const jaExiste = state.produtos.find(p=>chaveNormalizada(p.nome)===chaveNormalizada(nome) && chaveNormalizada(p.categoria)===chaveNormalizada(categoria));
        if(jaExiste){ ignorados++; return; }
        const categoriaJaExistia = state.categoriasProdutos.includes(categoria);
        if(!categoriaJaExistia) state.categoriasProdutos.push(categoria);
        if(!categoriaJaExistia && !(state.categoriasProdutosGrupo && state.categoriasProdutosGrupo[categoria])){
          if(!state.categoriasProdutosGrupo) state.categoriasProdutosGrupo = {};
          state.categoriasProdutosGrupo[categoria] = chaveGrupoProduto(r['Grupo']);
          categoriasGrupoAlterado = true;
        }
        state.produtos.push({id:uid(), nome, categoria, preco, ativo:true});
        novos++;
      });
      if(novos>0){ await save('produtos'); await save('categoriasProdutos'); }
      if(categoriasGrupoAlterado) await save('categoriasProdutosGrupo');
      resumo.push(novos+' produto(s) novo(s)'+(ignorados>0?' — '+ignorados+' ignorado(s)':''));
    }

    renderAll();
    alert('Importação concluída:\n\n'+resumo.join('\n'));
}
function lerArquivoPlanilha(file, onResult, containerId){
  if(typeof XLSX==='undefined' && /\.(xlsx|xls)$/i.test(file.name)){
    alert('Não consegui carregar o leitor de Excel (biblioteca não carregou). Confira sua conexão com a internet e tente de novo — ou exporte a planilha como CSV e importe o CSV.');
    return;
  }
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx' || ext==='xls'){
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:true});
        const nomes = wb.SheetNames;
        const usarSheet = function(nome){
          const ws = wb.Sheets[nome];
          const matriz = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, blankrows:false});
          if(!matriz || matriz.length<2){ alert('Essa aba da planilha parece vazia.'); return; }
          const headers = matriz[0].map(h=>String(h||'').trim());
          const linhas = matriz.slice(1).filter(l=>l.some(c=>c!=null && String(c).trim()!==''));
          onResult(headers, linhasParaObjetos(headers, linhas));
        };
        if(nomes.length===1){ usarSheet(nomes[0]); return; }
        const container = containerId ? document.getElementById(containerId) : null;
        if(!container){ usarSheet(nomes[0]); return; }
        container.innerHTML = '<div class="hint" style="margin-top:10px;">Essa planilha tem '+nomes.length+' aba(s). Escolha qual usar:</div>'+
          '<select id="sel-escolher-aba">'+nomes.map(n=>'<option value="'+n+'">'+n+'</option>').join('')+'</select> '+
          '<button type="button" class="btn small ghost" id="btn-confirmar-aba">Usar essa aba</button>';
        document.getElementById('btn-confirmar-aba').onclick = ()=>{
          const escolhida = document.getElementById('sel-escolher-aba').value;
          container.innerHTML = '';
          usarSheet(escolhida);
        };
      }catch(e){
        console.error(e);
        alert('Não consegui ler esse arquivo Excel. Detalhe: '+(e && e.message ? e.message : e)+'\n\nSe continuar falhando, exporte a planilha como CSV (Arquivo > Fazer download > CSV) e importe o CSV.');
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const text = ev.target.result;
      const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
      if(lines.length<2){ alert('O arquivo parece vazio.'); return; }
      const delim = detectDelimiter(lines[0]);
      const headers = parseDelimitedLine(lines[0], delim);
      const linhas = lines.slice(1).map(l=>parseDelimitedLine(l, delim));
      onResult(headers, linhasParaObjetos(headers, linhas));
    };
    reader.readAsText(file, 'UTF-8');
  }
}
function guessHeaderPriority(headers, groups){
  for(const kws of groups){
    const h = headers.find(h=>kws.some(k=>h.toLowerCase().includes(k)));
    if(h) return h;
  }
  return '';
}
function normalizarDataImportada(txt, fallback){
  const s = (txt||'').trim();
  if(!s) return fallback;
  const isoMatch = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(isoMatch) return isoMatch[1]+'-'+isoMatch[2]+'-'+isoMatch[3];
  const brMatch = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(brMatch){
    const dd = brMatch[1].padStart(2,'0');
    const mm = brMatch[2].padStart(2,'0');
    let yyyy = brMatch[3];
    if(yyyy.length===2) yyyy = '20'+yyyy;
    return yyyy+'-'+mm+'-'+dd;
  }
  const MESES_ABREV = {jan:1,fev:2,feb:2,mar:3,abr:4,apr:4,mai:5,may:5,jun:6,jul:7,ago:8,aug:8,set:9,sep:9,out:10,oct:10,nov:11,dez:12,dec:12};
  const mesAnoMatch = s.toLowerCase().match(/^([a-zçãé]{3,})[\s\/\-]*(\d{2,4})$/i);
  if(mesAnoMatch){
    const chave = mesAnoMatch[1].slice(0,3).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(MESES_ABREV[chave]){
      let yyyy = mesAnoMatch[2];
      if(yyyy.length===2) yyyy = '20'+yyyy;
      return yyyy+'-'+String(MESES_ABREV[chave]).padStart(2,'0')+'-01';
    }
  }
  const serialMatch = s.match(/^\d{4,6}(\.\d+)?$/);
  if(serialMatch){
    const serial = parseFloat(s);
    if(serial>15000 && serial<80000){
      const d = new Date(Math.round((serial-25569)*86400*1000));
      if(!isNaN(d.getTime())) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
    }
  }
  const soAno = s.match(/^(\d{4})$/);
  if(soAno) return soAno[1]+'-01-01';
  const tentativa = new Date(s);
  if(!isNaN(tentativa.getTime()) && s.length>5) return tentativa.getFullYear()+'-'+String(tentativa.getMonth()+1).padStart(2,'0')+'-01';
  return fallback;
}
function categoriaControladaEquivalente(texto){
  const chave = chaveNormalizada(texto||'');
  if(!chave) return false;
  const encontrada = CATEGORIAS_CONTROLADAS.find(c=>chaveNormalizada(c)===chave);
  if(encontrada) return true;
  if(/gas do povo/.test(chave)) return true;
  if(/(carga|vasilhame).*g[aá]s|g[aá]s.*(carga|vasilhame)|glp|botij[aã]o/.test(chave)) return true;
  if(/(carga|vasilhame).*[aá]gua|[aá]gua.*(carga|vasilhame)|safira|d ?fonte|dfonte/.test(chave)) return true;
  return false;
}

function detectarClientesPendentesVendas(linhasVendas){
  const distintos = new Map();
  linhasVendas.forEach(function(r){
    const texto = (r['Cliente']||'').trim();
    if(!texto) return;
    const chave = chaveNormalizada(texto);
    if(resolucaoClientesImportacaoDiaria[chave]) return;
    const existente = state.clientes.find(c=>chaveNormalizada(c.nome)===chave);
    if(existente) return;
    if(!distintos.has(chave)) distintos.set(chave, {texto, ocorrencias:0});
    distintos.get(chave).ocorrencias++;
  });
  return [...distintos.entries()];
}
function sugerirClienteSimilar(texto){
  let melhor=null, melhorScore=0;
  (state.clientes||[]).forEach(c=>{
    const score = similaridadeTexto(texto, c.nome);
    if(score>melhorScore){ melhorScore=score; melhor=c.nome; }
  });
  return {nome:melhor, score:melhorScore};

let resolucaoProdutosImportacaoDiaria = {};
function distanciaLevenshtein(a,b){
  const m=a.length, n=b.length;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  return dp[m][n];
}
function similaridadeTexto(a,b){
  const x=chaveNormalizada(a), y=chaveNormalizada(b);
  if(!x||!y) return 0;
  if(x===y) return 1;
  const maxLen = Math.max(x.length,y.length);
  if(maxLen===0) return 1;
  return 1 - (distanciaLevenshtein(x,y)/maxLen);
}
function sugerirCategoriaSimilar(texto){
  let melhor=null, melhorScore=0;
  (state.categoriasProdutos||[]).forEach(cat=>{
    const score = similaridadeTexto(texto, cat);
    if(score>melhorScore){ melhorScore=score; melhor=cat; }
  });
  return {categoria:melhor, score:melhorScore};
}
function detectarProdutosPendentesVendas(linhasVendas){
  const distintos = new Map();
  linhasVendas.forEach(function(r){
    const texto = (r['Categoria/Produto']||'').trim();
    if(!texto) return;
    const chave = chaveNormalizada(texto);
    if(resolucaoProdutosImportacaoDiaria[chave]) return;
    const existente = state.categoriasProdutos.find(c=>chaveNormalizada(c)===chave);
    if(existente) return;
    if(categoriaControladaEquivalente(texto)) return;
    if(!distintos.has(chave)) distintos.set(chave, {texto, ocorrencias:0});
    distintos.get(chave).ocorrencias++;
  });
  return [...distintos.entries()];
}

function showAuthMsg(text, ok){
  document.getElementById('auth-msg-wrap').innerHTML =
    '<div class="auth-msg '+(ok?'ok':'err')+'">'+text+'</div>';
}
function switchAuthTab(tab){
  document.querySelectorAll('[data-authtab]').forEach(b=>b.classList.toggle('active', b.dataset.authtab===tab));
  document.querySelectorAll('.auth-form').forEach(f=>f.classList.remove('active'));
  document.getElementById('form-'+tab).classList.add('active');
  document.getElementById('auth-msg-wrap').innerHTML = '';
}
const AUTH_DOMINIO_INTERNO = 'apptomgas.internal';
function normalizarUsuario(u){
  return (u||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9._-]/g,'');
}
function normalizarTelefoneAuth(t){
  return (t||'').replace(/\D/g,'');
}
function construirEmailAuth(tipo, valor){
  if(tipo==='telefone') return normalizarTelefoneAuth(valor)+'@'+AUTH_DOMINIO_INTERNO;
  if(tipo==='usuario') return normalizarUsuario(valor)+'@'+AUTH_DOMINIO_INTERNO;
  return (valor||'').trim().toLowerCase();
}
function detectarLoginEmail(identificador){
  const v = (identificador||'').trim();
  if(v.includes('@')) return v.toLowerCase();
  const soDigitos = v.replace(/\D/g,'');
  const naoDigitos = v.replace(/[0-9\s()+-]/g,'');
  if(soDigitos.length>=10 && soDigitos.length<=13 && naoDigitos.length===0){
    return normalizarTelefoneAuth(v)+'@'+AUTH_DOMINIO_INTERNO;
  }
  return normalizarUsuario(v)+'@'+AUTH_DOMINIO_INTERNO;
}
function attachAuthHandlers(){
  document.querySelectorAll('[data-authtab]').forEach(b=>b.onclick=()=>switchAuthTab(b.dataset.authtab));

  const cadastroTipo = document.getElementById('cadastro-tipo');
  if(cadastroTipo) cadastroTipo.onchange = ()=>{
    document.getElementById('cadastro-campo-email').style.display = cadastroTipo.value==='email' ? 'block' : 'none';
    document.getElementById('cadastro-campo-telefone').style.display = cadastroTipo.value==='telefone' ? 'block' : 'none';
    document.getElementById('cadastro-campo-usuario').style.display = cadastroTipo.value==='usuario' ? 'block' : 'none';
  };

  document.getElementById('form-login').onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const loginEmail = detectarLoginEmail(f.get('identificador'));
    const { error } = await supabaseClient.auth.signInWithPassword({ email:loginEmail, password:f.get('senha') });
    if(error){ showAuthMsg(error.message==='Invalid login credentials' ? 'E-mail/celular/usuário ou senha incorretos.' : error.message, false); return; }
    await afterLogin();
  };

  document.getElementById('form-cadastro').onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    if(f.get('senha') !== f.get('senha2')){ showAuthMsg('As senhas não conferem.', false); return; }
    const tipo = document.getElementById('cadastro-tipo').value;
    const valorCampo = tipo==='email' ? document.getElementById('cadastro-email').value :
      tipo==='telefone' ? document.getElementById('cadastro-telefone').value :
      document.getElementById('cadastro-usuario').value;
    if(!valorCampo || !valorCampo.trim()){
      showAuthMsg(tipo==='email' ? 'Informe o e-mail.' : tipo==='telefone' ? 'Informe o celular.' : 'Informe o usuário.', false);
      return;
    }
    const loginEmail = construirEmailAuth(tipo, valorCampo);
    const { error } = await supabaseClient.auth.signUp({
      email:loginEmail, password:f.get('senha'),
      options: { data: {
        nome: f.get('nome'),
        tipo_login: tipo,
        email_real: tipo==='email' ? valorCampo.trim() : '',
        telefone: tipo==='telefone' ? normalizarTelefoneAuth(valorCampo) : '',
        usuario: tipo==='usuario' ? normalizarUsuario(valorCampo) : ''
      } }
    });
    if(error){ showAuthMsg(error.message, false); return; }
    if(tipo==='email'){
      showAuthMsg('Conta criada! Verifique seu e-mail para confirmar antes de entrar.', true);
    } else {
      showAuthMsg('Conta criada! Já pode entrar usando o '+(tipo==='telefone'?'celular':'usuário')+' e a senha cadastrados.', true);
    }
    switchAuthTab('login');
  };

  document.getElementById('form-recuperar').onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const { error } = await supabaseClient.auth.resetPasswordForEmail(f.get('email'), { redirectTo: window.location.href });
    if(error){ showAuthMsg(error.message, false); return; }
    showAuthMsg('Enviamos um link de recuperação para o seu e-mail.', true);
  };
}

/* ---------- PWA / NOTIFICAÇÕES ---------- */
function registerServiceWorker(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update();
      setInterval(()=>reg.update(), 60*1000);
      reg.addEventListener('updatefound', ()=>{
        const novoSW = reg.installing;
        if(!novoSW) return;
        novoSW.addEventListener('statechange', ()=>{
          if(novoSW.state==='installed' && navigator.serviceWorker.controller){
            novoSW.postMessage({acao:'skipWaiting'});
          }
        });
      });
    }).catch(e=>console.error('Erro ao registrar service worker', e));
    let jaRecarregouPorAtualizacao = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(jaRecarregouPorAtualizacao) return;
      jaRecarregouPorAtualizacao = true;
      window.location.reload();
    });
  }
}
function statusPermissaoNotificacao(){
  if(!('Notification' in window)) return 'indisponivel';
  return Notification.permission;
}
async function pedirPermissaoNotificacao(){
  if(!('Notification' in window)){ alert('Este navegador não suporta notificações.'); return; }
  const perm = await Notification.requestPermission();
  renderAll();
  if(perm==='granted'){
    notificarLocal('Notificações ativadas', 'Você vai receber avisos de novos agendamentos e entregas por aqui.');
    await inscreverPush();
  }
}
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
async function inscreverPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    await supabaseClient.from('push_subscriptions').upsert({
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }, { onConflict: 'endpoint' });
  }catch(e){ console.error('Erro ao se inscrever para notificações push', e); }
}
async function enviarPushServidor(titulo, corpo){
  try{
    await fetch(SUPABASE_URL + '/functions/v1/swift-handler', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ title: titulo, body: corpo })
    });
  }catch(e){ console.error('Erro ao enviar notificação push', e); }
}
function atualizarBadgeApp(){

  const pendentesAg = state.agendamentos.filter(a=>a.status==='pendente').length;
  const pendentesVenda = state.vendas.filter(v=>v.entrega_hora && v.entrega_status!=='entregue').length;
  const pendentes = pendentesAg + pendentesVenda;
  try{
    if(pendentes>0) navigator.setAppBadge(pendentes).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }catch(e){}

function notificarLocal(titulo, corpo){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const options = { body: corpo, icon: 'icon-192-v2.png', badge: 'icon-192-v2.png', vibrate:[200,100,200] };
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration().then(reg=>{
      if(reg && reg.showNotification){ reg.showNotification(titulo, options); }
      else { new Notification(titulo, options); }
    }).catch(()=>{ try{ new Notification(titulo, options); }catch(e){ console.error('Notificação falhou', e); } });
  } else {
    try{ new Notification(titulo, options); }catch(e){ console.error('Notificação falhou', e); }
  }
}
function iniciarNotificacoesRealtime(){
  try{
    supabaseClient.channel('app_data_mudancas')
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_data', filter:'chave=eq.agendamentos' }, (payload)=>{
        const novoValor = payload.new && payload.new.valor ? payload.new.valor : [];
        const idsAntigos = new Set(state.agendamentos.map(a=>a.id));
        const novos = novoValor.filter(a=>!idsAntigos.has(a.id));
        novos.forEach(a=>{
          notificarLocal('Novo agendamento de entrega', (a.cliente||'Cliente')+' — '+(a.hora||'')+(a.data?' ('+fmtDate(a.data)+')':''));
        });
        state.agendamentos = novoValor;
        atualizarBadgeApp();
        if(currentTab==='agendamentos' || currentTab==='dashboard') renderAll();
      })
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_data', filter:'chave=eq.vendas' }, (payload)=>{
        const novoValor = payload.new && payload.new.valor ? payload.new.valor : [];
        const idsAntigos = new Set(state.vendas.map(v=>v.id));
        const novos = novoValor.filter(v=>!idsAntigos.has(v.id) && v.entrega_hora);
        novos.forEach(v=>{
          notificarLocal('Nova entrega registrada', (v.cliente||'Cliente')+' — '+v.produto+' às '+v.entrega_hora);
        });
        state.vendas = novoValor;
        if(currentTab==='vendas' || currentTab==='dashboard') renderAll();
      })
      .subscribe();
  }catch(e){ console.error('Erro ao iniciar notificações em tempo real', e); }
}

/* ---------- QTY STEPPER (setinhas +/- de quantidade) ---------- */
document.addEventListener('click', function(e){
  const btn = e.target.closest('.qty-btn');
  if(!btn) return;
  const wrap = btn.closest('.qty-stepper');
  const input = wrap ? wrap.querySelector('input[type=number]') : null;
  if(!input) return;
  const min = input.min!=='' ? Number(input.min) : -Infinity;
  const step = Number(input.step)||1;
  let val = Number(input.value)||0;
  val = btn.classList.contains('qty-plus') ? val+step : val-step;
  if(val<min) val = min;
  input.value = val;
  input.dispatchEvent(new Event('input', {bubbles:true}));
});

function initAgenda(){
  const fab = document.getElementById('agenda-fab'), overlay = document.getElementById('agenda-overlay'),
    drawer = document.getElementById('agenda-drawer'), fechar = document.getElementById('agenda-fechar'),
    form = document.getElementById('form-agenda-evento'), cancelarEd = document.getElementById('agenda-cancelar-edicao');
  function abrir(){ drawer.classList.add('open'); overlay.classList.add('open'); renderAgendaLista(); }
  function fecharDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }
  if(fab) fab.onclick = abrir;
  if(fechar) fechar.onclick = fecharDrawer;
  if(overlay) overlay.onclick = fecharDrawer;
  if(cancelarEd) cancelarEd.onclick = ()=>{ form.reset(); form.id.value=''; cancelarEd.style.display='none'; };
  if(form) form.onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(form);
    const id = f.get('id');
    const dados = {
      titulo:f.get('titulo'), data:f.get('data'), hora:f.get('hora'), categoria:f.get('categoria'),
      prioridade:f.get('prioridade'), lembrete:f.get('lembrete'), status:f.get('status'),
      som: form.som.checked, obs:f.get('obs')||''
    };
    if(!state.agendaEventos) state.agendaEventos = [];
    if(id){
      const idx = state.agendaEventos.findIndex(x=>x.id===id);
      if(idx>-1) state.agendaEventos[idx] = Object.assign(state.agendaEventos[idx], dados);
    } else {
      dados.id = uid(); dados.avisado = {};
      state.agendaEventos.push(dados);
    }
    await save('agendaEventos');
    form.reset(); form.id.value=''; if(cancelarEd) cancelarEd.style.display='none';
    renderAgendaLista();
  };
  document.getElementById('agenda-lista').addEventListener('click', async(e)=>{
    const btnEd = e.target.closest('[data-ag-editar]'), btnEx = e.target.closest('[data-ag-excluir]');
    if(btnEd){
      const ev = state.agendaEventos.find(x=>x.id===btnEd.dataset.agEditar);
      if(!ev) return;
      form.id.value = ev.id; form.titulo.value = ev.titulo; form.data.value = ev.data; form.hora.value = ev.hora;
      form.categoria.value = ev.categoria; form.prioridade.value = ev.prioridade; form.lembrete.value = ev.lembrete;
      form.status.value = ev.status; form.som.checked = !!ev.som; form.obs.value = ev.obs||'';
      if(cancelarEd) cancelarEd.style.display='inline-block';
    }
    if(btnEx){
      if(!confirm('Excluir esse evento?')) return;
      state.agendaEventos = state.agendaEventos.filter(x=>x.id!==btnEx.dataset.agExcluir);
      await save('agendaEventos');
      renderAgendaLista();
    }
  });
  // Verifica lembretes a cada minuto e toca som se estiver na hora
  setInterval(()=>{
    const agora = new Date();
    (state.agendaEventos||[]).forEach(ev=>{
      if(ev.status!=='Pendente' || !ev.lembrete || Number(ev.lembrete)<=0) return;
      const alvo = new Date(ev.data+'T'+ev.hora+':00');
      const minsAntes = Number(ev.lembrete);
      const diffMin = (alvo - agora)/60000;

        };
        return '<div style="margin-top:16px;border-top:1px solid #eee;padding-top:16px;"><div style="font-weight:bold;margin-bottom:8px;">💵 Recebimento</div>'+
          (st==='aguardaEntregador' ? '<button id="btn-recebi-dinheiro" style="width:100%;padding:14px;font-size:15px;font-weight:bold;background:#f5a623;color:#fff;border:none;border-radius:10px;">💰 Confirmar que recebi o pagamento ('+(entrega.pagamento||'na hora')+')</button><div style="font-size:11.5px;color:#888;margin-top:6px;">'+(dinheiro?'Depois de confirmar, leve o dinheiro até o financeiro pra fechar o acerto pessoalmente.':'Depois de confirmar, o financeiro já pode conferir à distância e fechar o acerto.')+'</div>' : '<div style="color:'+(st==='aguardaAcerto'?'#b45309':'#188038')+';font-size:13px;">'+textos[st]+'</div>')+
        '</div>';
      })() : '')+
      (concluida ? '<div style="margin-top:16px;border-top:1px solid #eee;padding-top:16px;"><div style="font-weight:bold;margin-bottom:8px;">🙋 Correu tudo certo, conforme combinado?</div>'+
        (entrega.atendimentoOk===undefined || entrega.atendimentoOk===null ?
          '<div style="display:flex;gap:8px;"><button id="btn-atend-ok" style="flex:1;padding:12px;background:#25D366;color:#fff;border:none;border-radius:10px;font-weight:bold;">✅ Sim</button><button id="btn-atend-problema" style="flex:1;padding:12px;background:#e53935;color:#fff;border:none;border-radius:10px;font-weight:bold;">⚠️ Teve problema</button></div>' :
          '<div style="font-size:13px;color:'+(entrega.atendimentoOk?'#188038':'#c62828')+';">'+(entrega.atendimentoOk?'✅ Confirmado: tudo certo.':'⚠️ Problema sinalizado — financeiro vai conferir.')+'</div>')+
        '</div>' : '')+
      (anexosHistorico.length>0 ? '<div style="margin-top:14px;"><div style="font-weight:bold;font-size:13px;margin-bottom:6px;">🗂 Histórico de entregas anteriores desse cliente:</div><div style="display:flex;flex-wrap:wrap;gap:8px;">'+anexosHistorico.map(thumbAnexo).join('')+'</div></div>' : '')+
      (anexosDele.length>0 ? '<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;">'+anexosDele.map(thumbAnexo).join('')+'</div>' : '')+
      '<div style="margin-top:16px;border-top:1px solid #eee;padding-top:16px;"><div style="font-weight:bold;margin-bottom:8px;">📎 Anexar foto, vídeo ou localização do local</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
        '<label class="btn-anexo-extra" style="flex:1;text-align:center;padding:10px;background:#eef3fb;border-radius:10px;font-size:13px;cursor:pointer;">📷 Foto<input type="file" id="input-anexo-foto" accept="image/*" style="display:none;"></label>'+
        '<label class="btn-anexo-extra" style="flex:1;text-align:center;padding:10px;background:#eef3fb;border-radius:10px;font-size:13px;cursor:pointer;">🎥 Vídeo<input type="file" id="input-anexo-video" accept="video/*" style="display:none;"></label>'+
        '<button type="button" id="btn-anexo-local" style="flex:1;padding:10px;background:#eef3fb;border:none;border-radius:10px;font-size:13px;">📍 Localização</button>'+
        '</div></div>'+
      '<div id="msg-conf" style="margin-top:14px;font-weight:bold;color:#188038;text-align:center;"></div>';

    const btnSaiu = document.getElementById('btn-status-saiu');
    if(btnSaiu && !entrega.notifSaiu) btnSaiu.onclick = async()=>{
      const ok = await enviarStatusWhatsApp('saiu',btnSaiu,'🚚 INICIAR TRAJETO');
      if(ok){ entrega.marcarNotif('notif_saiu'); entrega.notifSaiu=true; const salvou=await entrega.salvar(); if(!salvou){ alert('O aviso foi enviado, mas não foi possível salvar o passo no sistema.'); return; } render(); }
    };
    const btnChegou = document.getElementById('btn-status-chegou');
    if(btnChegou && podeChegar) btnChegou.onclick = async()=>{
      const ok = await enviarStatusWhatsApp('chegou',btnChegou,'📍 CHEGAMOS AO LOCAL');
      if(ok){ entrega.marcarNotif('notif_chegou'); entrega.notifChegou=true; const salvou=await entrega.salvar(); if(!salvou){ alert('O aviso foi enviado, mas não foi possível salvar o passo no sistema.'); return; } render(); }
    };
    const btnConcluido = document.getElementById('btn-status-concluido');
    if(btnConcluido && podeConcluir) btnConcluido.onclick = async()=>{
      btnConcluido.disabled=true; btnConcluido.textContent='⏳ Finalizando...';
      const okWhats = await enviarStatusWhatsApp('concluido',null);
      if(!okWhats){ btnConcluido.disabled=false; btnConcluido.textContent='✅ ENTREGUE'; return; }
      entrega.marcarConcluido();
      const ok2=await entrega.salvar();
      if(!ok2){ entrega.desmarcarConcluido(); alert('A mensagem foi enviada, mas não foi possível salvar a conclusão. Tente novamente.'); btnConcluido.disabled=false; btnConcluido.textContent='✅ ENTREGUE'; return; }
      try{ await enviarPushServidor('Entrega concluída',(entrega.cliente||'Cliente')+' — entrega finalizada pelo entregador.'); }catch(e){ console.error('Erro ao notificar',e); }
      await registrarTempoEntrega();
      await registrarOuAtualizarPendencia();
      await registrarOuAtualizarAcerto();
      avisarNumeroPrincipal();
      entrega.jaConcluido=true; render();
      const msg=document.getElementById('msg-conf'); if(msg) msg.textContent='✅ Entrega concluída! Mensagem com o link de avaliação enviada ao cliente.';
    };
    const btnRecebiDinheiro=document.getElementById('btn-recebi-dinheiro');
    if(btnRecebiDinheiro) btnRecebiDinheiro.onclick=async()=>{
      entrega.marcarRecebido();
      const ok=await entrega.salvar();
      if(!ok){ alert('Não foi possível salvar. Tente novamente.'); return; }
      await registrarOuAtualizarPendencia();
      await registrarOuAtualizarAcerto();
      render(); const msg=document.getElementById('msg-conf'); if(msg) msg.textContent='💰 Recebimento confirmado! Aguardando o financeiro conferir o acerto.';
    };
    function responderAtendimento(ok){
      const obs = ok ? '' : (prompt('Descreva rapidamente o que aconteceu:')||'');
      return async()=>{
        entrega.marcarAtendimento(ok, obs);
        const salvou=await entrega.salvar();
        if(!salvou){ alert('Não foi possível salvar. Tente novamente.'); return; }
        await registrarOuAtualizarPendencia();
        render();
      };
    }
    const btnAtendOk=document.getElementById('btn-atend-ok');
    if(btnAtendOk) btnAtendOk.onclick=responderAtendimento(true);
    const btnAtendProblema=document.getElementById('btn-atend-problema');
    if(btnAtendProblema) btnAtendProblema.onclick=responderAtendimento(false);
    const inputAnexoFoto=document.getElementById('input-anexo-foto');
    if(inputAnexoFoto) inputAnexoFoto.onchange=()=>{
      const file=inputAnexoFoto.files[0]; if(!file)return;
      if(file.size>8*1024*1024){alert('Arquivo muito grande.');return;}
      const r=new FileReader();
      r.onload=async(ev)=>{ const ok=await salvarAnexo({tipo:'foto',dataUrl:ev.target.result,obs:''}); if(!ok){alert('Erro ao salvar.');return;} render(); const msg=document.getElementById('msg-conf'); if(msg) msg.textContent='📷 Foto salva no histórico do cliente!'; };
      r.readAsDataURL(file);
    };
    const inputAnexoVideo=document.getElementById('input-anexo-video');
    if(inputAnexoVideo) inputAnexoVideo.onchange=()=>{
      const file=inputAnexoVideo.files[0]; if(!file)return;
      if(file.size>15*1024*1024){alert('Vídeo muito grande.');return;}
      const r=new FileReader();
      r.onload=async(ev)=>{ const ok=await salvarAnexo({tipo:'video',dataUrl:ev.target.result,obs:''}); if(!ok){alert('Erro ao salvar.');return;} render(); const msg=document.getElementById('msg-conf'); if(msg) msg.textContent='🎥 Vídeo salvo no histórico do cliente!'; };
      r.readAsDataURL(file);
    };
    const btnAnexoLocal=document.getElementById('btn-anexo-local');
    if(btnAnexoLocal) btnAnexoLocal.onclick=()=>{
      if(!navigator.geolocation){ alert('Este navegador não suporta localização.'); return; }
      navigator.geolocation.getCurrentPosition(async(pos)=>{
        const ok=await salvarAnexo({tipo:'localizacao',lat:pos.coords.latitude,lng:pos.coords.longitude,obs:''});
        if(!ok){alert('Erro ao salvar.');return;} render(); const msg=document.getElementById('msg-conf'); if(msg) msg.textContent='📍 Localização salva no histórico do cliente!';
      }, (err)=>{ alert('Não foi possível obter a localização: '+(err.message||err)); });
    };
    const inputFoto=document.getElementById('input-foto-comprovante');
    if(inputFoto) inputFoto.onchange=()=>{
      const file=inputFoto.files[0]; if(!file)return;
      if(file.size>6*1024*1024){alert('Foto muito grande. Tente uma foto menor.');return;}
      const r=new FileReader();
      r.onload=async(ev)=>{
        anexos.push(Object.assign({id:uid(),tipo:'foto',dataUrl:ev.target.result,cliente:entrega.cliente||'',paradaId:'',data:todayStr(),entregadorId:'',obs:'Comprovante de entrega',criadoEm:Date.now()},entrega.anexoContexto));
        const {error:err3}=await supabaseClient.from('app_data').upsert({chave:'anexosEntrega',valor:anexos,atualizado_em:new Date().toISOString()},{onConflict:'chave'});
        if(err3){alert('Erro ao salvar a foto. Tente novamente.');return;}
        render(); const msg=document.getElementById('msg-conf'); if(msg) msg.textContent='📷 Foto de comprovante enviada!';
      }; r.readAsDataURL(file);
    };
  }
  render();
}

async function init(){
  const paramsUrl = new URLSearchParams(location.search);
  const entregaId = paramsUrl.get('entrega');
  const entregaVendaId = paramsUrl.get('entregaVenda');
  if(entregaId){ await iniciarConfirmacaoEntregaPublica('agendamento', entregaId); return; }
  if(entregaVendaId){ await iniciarConfirmacaoEntregaPublica('venda', entregaVendaId); return; }
  attachAuthHandlers();
  attachLogoInput();
  registerServiceWorker();
  const { data:{ session } } = await supabaseClient.auth.getSession();
  if(session){
    await afterLogin();
  } else {
    document.getElementById('auth-screen').style.display = 'flex';
  }
}
init();
</script>
</body>
</html>
