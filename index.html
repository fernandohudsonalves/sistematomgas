}
function processarImportacaoDiariaExcel(file){
  if(typeof XLSX==='undefined'){ alert('Não consegui carregar a biblioteca de Excel. Confira sua conexão com a internet e tente de novo.'); return; }
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    let wb;
    try{
      wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:true});
    }catch(e){
      alert('Não consegui ler esse arquivo Excel. Detalhe: '+(e && e.message ? e.message : e));
      return;
    }
    const lerAba = function(nome){
      const nomeReal = wb.SheetNames.find(n=>chaveNormalizada(n)===chaveNormalizada(nome));
      if(!nomeReal) return [];
      const ws = wb.Sheets[nomeReal];
      const matriz = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, dateNF:'yyyy-mm-dd', blankrows:false});
      if(!matriz || matriz.length<2) return [];
      const headers = matriz[0].map(h=>String(h||'').trim());
      const linhas = matriz.slice(1).filter(l=>l.some(c=>c!=null && String(c).trim()!==''));
      return linhasParaObjetos(headers, linhas);
    };
    const linhasVendas = lerAba('Vendas');
    const linhasDespesas = lerAba('Despesas');
    const linhasClientes = lerAba('Clientes');
    const linhasProdutos = lerAba('Produtos');
    if(linhasVendas.length+linhasDespesas.length+linhasClientes.length+linhasProdutos.length===0){
      alert('Não encontrei nenhuma linha preenchida nas abas Vendas, Despesas, Clientes ou Produtos desse arquivo.');
      return;
    }
    const resumo = [];
    const hoje = todayStr();
    const nomesClientesExistentes = new Set(state.clientes.map(c=>chaveNormalizada(c.nome)));

    if(linhasVendas.length){
      let importadas=0, ignoradas=0, clientesNovosDeVendas=0, creditosAlterados=false, fiadosGeradosPorAbate=0;
      const gruposPorChaveVenda = new Map();
      linhasVendas.forEach(function(r){
        const textoCategoria = (r['Categoria/Produto']||'').trim();
        if(!textoCategoria){ ignoradas++; return; }
        const chaveTexto = chaveNormalizada(textoCategoria);
        const categoriaExistente = state.categoriasProdutos.find(c=>chaveNormalizada(c)===chaveTexto);
        let categoria = categoriaExistente;
        if(!categoria){
          if(categoriaControladaEquivalente(textoCategoria)){ ignoradas++; return; }
          categoria = textoCategoria;
          if(!state.categoriasProdutos.includes(categoria)) state.categoriasProdutos.push(categoria);
        }
        const controlada = isControlada(categoria);
        const produto = controlada ? categoria : textoCategoria;
        const quantidade = r['Quantidade'] ? (Number(String(r['Quantidade']).replace(',','.'))||1) : 1;
        const valor_unit = r['Valor Unitário'] ? (Number(String(r['Valor Unitário']).replace(/\./g,'').replace(',','.'))||0) : 0;
        const valor_total = Math.round(quantidade*valor_unit*100)/100;
        const data = r['Data'] ? normalizarDataImportada(r['Data'], hoje) : hoje;
        const cliente = (r['Cliente']||'').trim();
        if(cliente){
          const chaveCliente = chaveNormalizada(cliente);
          if(!nomesClientesExistentes.has(chaveCliente)){
            nomesClientesExistentes.add(chaveCliente);
            state.clientes.push({
              id: uid(), nome: cliente,
              telefone: (r['Telefone Cliente']||'').trim(),
              endereco: (r['Endereço Cliente']||'').trim(),
              complemento: (r['Complemento Cliente']||'').trim(),
              obs: ''
            });
            clientesNovosDeVendas++;
          }
        }
        const canal = (r['Canal']||'').trim() || CANAIS[0];
        const pagamento = (r['Forma de Pagamento']||'').trim() || PAGAMENTOS[0];
        const nota = (r['Nota']||'').trim() || 'Não lança';
        const tipo_entrega = (r['Tipo de Entrega']||'').trim() || TIPOS_ENTREGA[0];
        const empresa = (r['Empresa Convênio']||'').trim();
        const obs = (r['Observação']||'').trim();

        // Agrupa linhas da mesma compra (ex.: gás + água na mesma venda) pra contar como
        // um único "carrinho" no ticket médio: usa o Nº da Venda quando preenchido, ou
        // cliente+data como segunda opção. Sem nenhum dos dois, cada linha fica separada.
        const numeroVenda = (r['Nº da Venda']||'').trim();
        const chaveGrupo = numeroVenda ? ('num:'+numeroVenda) : (cliente ? ('cli:'+data+':'+chaveNormalizada(cliente)) : null);
        let grupoId, primeiraLinhaDoGrupo = true;
        if(chaveGrupo){
          if(gruposPorChaveVenda.has(chaveGrupo)){ grupoId = gruposPorChaveVenda.get(chaveGrupo); primeiraLinhaDoGrupo = false; }
          else { grupoId = uid(); gruposPorChaveVenda.set(chaveGrupo, grupoId); }
        } else { grupoId = uid(); }
        const freteBruto = TIPOS_ENTREGA_COM_FRETE.includes(tipo_entrega) ? (Number(String(r['Frete']||'0').replace(',','.'))||0) : 0;
        const frete = primeiraLinhaDoGrupo ? freteBruto : 0;
        const venda = {
          id: uid(), criadoEm: Date.now(), grupoId, fiado_pago:false,
          data, cliente, canal, categoria, produto, quantidade, valor_unit, valor_total,
          pagamento, nota, tipo_entrega, empresa, frete,
          entrega_data:'', entrega_hora:'', entrega_status:'', obs: obs || 'Importado de planilha'
        };
        state.vendas.push(venda);
        ajustaEstoquePorVenda(categoria, quantidade, false);
        importadas++;

        // Se a planilha marcou a venda como "Abateu", desconta automaticamente do crédito em
        // haver do cliente (igual ao lançamento manual) e, se sobrar diferença, lança de fiado —
        // sem precisar escolher nada na hora de importar.
        if(pagamento==='Abateu' && cliente){
          const totalVendaComFrete = Math.round((valor_total+frete)*100)/100;
          const saldoAntes = saldoCreditoCliente(cliente);
          const abatido = Math.round(Math.min(Math.max(saldoAntes,0), totalVendaComFrete)*100)/100;
          const diferenca = Math.round((totalVendaComFrete-abatido)*100)/100;
          state.creditos.push({id:uid(), cliente:cliente, valor:-abatido, data:data,
            obs:'Abatido na venda de '+fmtMoney(totalVendaComFrete)+(diferenca>0.004?' (diferença de '+fmtMoney(diferenca)+' foi pro fiado)':'')+' — importado de planilha'});
          creditosAlterados = true;
          if(diferenca>0.004){
            state.fiados.push({id:uid(), cliente:cliente, valor:diferenca, data:data,
              descricao:'Diferença da venda de '+fmtMoney(totalVendaComFrete)+' (parte paga com crédito em haver — importado de planilha)', status:'aberto'});
            venda.pagamento = 'Abateu + Fiado';
            fiadosGeradosPorAbate++;
          }
        }
      });
      if(importadas>0){ await save('vendas'); await save('estoque'); await save('categoriasProdutos'); if((state.pendenciasConferencia||[]).length) await save('pendenciasConferencia'); }
      if(clientesNovosDeVendas>0) await save('clientes');
      if(creditosAlterados) await save('creditos');
      if(fiadosGeradosPorAbate>0) await save('fiados');
      resumo.push(importadas+' venda(s) importada(s)'+(ignoradas>0?' — '+ignoradas+' ignorada(s) (sem categoria/produto válido)':''));
      if(clientesNovosDeVendas>0) resumo.push(clientesNovosDeVendas+' cliente(s) novo(s) cadastrado(s) a partir da aba Vendas');
      if(creditosAlterados) resumo.push('Crédito em haver abatido automaticamente nas vendas marcadas como "Abateu"'+(fiadosGeradosPorAbate>0?' ('+fiadosGeradosPorAbate+' com diferença lançada de fiado)':''));
    }

    if(linhasDespesas.length){
      let importadas=0, ignoradas=0;
      linhasDespesas.forEach(function(r){
        const valor = Number(String(r['Valor']||'0').replace(/\./g,'').replace(',','.'))||0;
        if(!valor || valor<=0){ ignoradas++; return; }
        const categoriaTxt = (r['Categoria']||'').trim();
        const categoriaExistente = state.categoriasDespesas.find(c=>chaveNormalizada(c)===chaveNormalizada(categoriaTxt));
        const categoria = categoriaExistente || categoriaTxt || state.categoriasDespesas[0];
        if(categoriaTxt && !categoriaExistente && !state.categoriasDespesas.includes(categoria)){state.categoriasDespesas.push(categoria);adicionarPendenciaConferencia('despesa','categoria',categoriaTxt,'Categoria não encontrada exatamente no cadastro; confira.');}
        const data = r['Data'] ? normalizarDataImportada(r['Data'], hoje) : hoje;
        const descricao = (r['Descrição']||'').trim();
        state.despesas.push({id:uid(), criadoEm:Date.now(), data, categoria, valor, descricao: descricao || 'Importado de planilha'});
        importadas++;
      });
      if(importadas>0){ await save('despesas'); await save('categoriasDespesas'); if((state.pendenciasConferencia||[]).length) await save('pendenciasConferencia'); }
      resumo.push(importadas+' despesa(s) importada(s)'+(ignoradas>0?' — '+ignoradas+' ignorada(s) (sem valor)':''));
    }

    if(linhasClientes.length){
      let novos=0, duplicados=0;
      linhasClientes.forEach(function(r){
        const nome = (r['Nome']||'').trim();
        if(!nome) return;
        const chave = chaveNormalizada(nome);
        if(nomesClientesExistentes.has(chave)){ duplicados++; return; }
        nomesClientesExistentes.add(chave);
        state.clientes.push({id:uid(), nome, telefone:(r['Telefone']||'').trim(), endereco:(r['Endereço']||'').trim(), complemento:(r['Complemento']||'').trim(), obs:(r['Observação']||'').trim()});
        novos++;
      });
      if(novos>0) await save('clientes');
      resumo.push(novos+' cliente(s) novo(s) cadastrado(s) a partir da aba Clientes'+(duplicados>0?' — '+duplicados+' já existiam':''));
    }

    if(linhasProdutos.length){
      let novos=0, ignorados=0;
      let categoriasGrupoAlterado = false;
      linhasProdutos.forEach(function(r){
        const nome = (r['Produto']||r['Nome']||'').trim();
        if(!nome){ ignorados++; return; }
        const categoria = (r['Categoria']||'').trim() || 'Outros';
        if(categoriaControladaEquivalente(nome) || categoriaControladaEquivalente(categoria)){ ignorados++; return; }
        const preco = Number(String(r['Preço']||'0').replace(/\./g,'').replace(',','.'))||0;
        const jaExiste = state.produtos.find(p=>chaveNormalizada(p.nome)===chaveNormalizada(nome) && chaveNormalizada(p.categoria)===chaveNormalizada(categoria));
        if(jaExiste){ ignorados++; return; }
        const categoriaJaExistia = state.categoriasProdutos.includes(categoria);
        if(!categoriaJaExistia) state.categoriasProdutos.push(categoria);
        if(!categoriaJaExistia && !(state.categoriasProdutosGrupo && state.categoriasProdutosGrupo[categoria])){
          if(!state.categoriasProdutosGrupo) state.categoriasProdutosGrupo = {};
          state.categoriasProdutosGrupo[categoria] = chaveGrupoProduto(r['Grupo']);
          categoriasGrupoAlterado = true;
        }
        state.produtos.push({id:uid(), nome, categoria, preco, ativo:true});
        novos++;
      });
      if(novos>0){ await save('produtos'); await save('categoriasProdutos'); }
      if(categoriasGrupoAlterado) await save('categoriasProdutosGrupo');
      resumo.push(novos+' produto(s) novo(s)'+(ignorados>0?' — '+ignorados+' ignorado(s)':''));
    }

    renderAll();
    alert('Importação concluída:\n\n'+resumo.join('\n'));
  };
  reader.readAsArrayBuffer(file);
}
function lerArquivoPlanilha(file, onResult, containerId){
  if(typeof XLSX==='undefined' && /\.(xlsx|xls)$/i.test(file.name)){
    alert('Não consegui carregar o leitor de Excel (biblioteca não carregou). Confira sua conexão com a internet e tente de novo — ou exporte a planilha como CSV e importe o CSV.');
    return;
  }
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx' || ext==='xls'){
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:true});
        const nomes = wb.SheetNames;
        const usarSheet = function(nome){
          const ws = wb.Sheets[nome];
          const matriz = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, blankrows:false});
          if(!matriz || matriz.length<2){ alert('Essa aba da planilha parece vazia.'); return; }
          const headers = matriz[0].map(h=>String(h||'').trim());
          const linhas = matriz.slice(1).filter(l=>l.some(c=>c!=null && String(c).trim()!==''));
          onResult(headers, linhasParaObjetos(headers, linhas));
        };
        if(nomes.length===1){ usarSheet(nomes[0]); return; }
        const container = containerId ? document.getElementById(containerId) : null;
        if(!container){ usarSheet(nomes[0]); return; }
        container.innerHTML = '<div class="hint" style="margin-top:10px;">Essa planilha tem '+nomes.length+' aba(s). Escolha qual usar:</div>'+
          '<select id="sel-escolher-aba">'+nomes.map(n=>'<option value="'+n+'">'+n+'</option>').join('')+'</select> '+
          '<button type="button" class="btn small ghost" id="btn-confirmar-aba">Usar essa aba</button>';
        document.getElementById('btn-confirmar-aba').onclick = ()=>{
          const escolhida = document.getElementById('sel-escolher-aba').value;
          container.innerHTML = '';
          usarSheet(escolhida);
        };
      }catch(e){
        console.error(e);
        alert('Não consegui ler esse arquivo Excel. Detalhe: '+(e && e.message ? e.message : e)+'\n\nSe continuar falhando, exporte a planilha como CSV (Arquivo > Fazer download > CSV) e importe o CSV.');
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const text = ev.target.result;
      const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
      if(lines.length<2){ alert('O arquivo parece vazio.'); return; }
      const delim = detectDelimiter(lines[0]);
      const headers = parseDelimitedLine(lines[0], delim);
      const linhas = lines.slice(1).map(l=>parseDelimitedLine(l, delim));
      onResult(headers, linhasParaObjetos(headers, linhas));
    };
    reader.readAsText(file, 'UTF-8');
  }
}
function guessHeaderPriority(headers, groups){
  for(const kws of groups){
    const h = headers.find(h=>kws.some(k=>h.toLowerCase().includes(k)));
    if(h) return h;
  }
  return '';
}
function normalizarDataImportada(txt, fallback){
  const s = (txt||'').trim();
  if(!s) return fallback;
  const isoMatch = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(isoMatch) return isoMatch[1]+'-'+isoMatch[2]+'-'+isoMatch[3];
  const brMatch = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(brMatch){
    const dd = brMatch[1].padStart(2,'0');
    const mm = brMatch[2].padStart(2,'0');
    let yyyy = brMatch[3];
    if(yyyy.length===2) yyyy = '20'+yyyy;
    return yyyy+'-'+mm+'-'+dd;
  }
  const MESES_ABREV = {jan:1,fev:2,feb:2,mar:3,abr:4,apr:4,mai:5,may:5,jun:6,jul:7,ago:8,aug:8,set:9,sep:9,out:10,oct:10,nov:11,dez:12,dec:12};
  const mesAnoMatch = s.toLowerCase().match(/^([a-zçãé]{3,})[\s\/\-]*(\d{2,4})$/i);
  if(mesAnoMatch){
    const chave = mesAnoMatch[1].slice(0,3).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(MESES_ABREV[chave]){
      let yyyy = mesAnoMatch[2];
      if(yyyy.length===2) yyyy = '20'+yyyy;
      return yyyy+'-'+String(MESES_ABREV[chave]).padStart(2,'0')+'-01';
    }
  }
  const serialMatch = s.match(/^\d{4,6}(\.\d+)?$/);
  if(serialMatch){
    const serial = parseFloat(s);
    if(serial>15000 && serial<80000){
      const d = new Date(Math.round((serial-25569)*86400*1000));
      if(!isNaN(d.getTime())) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
    }
  }
  const soAno = s.match(/^(\d{4})$/);
  if(soAno) return soAno[1]+'-01-01';
  const tentativa = new Date(s);
  if(!isNaN(tentativa.getTime()) && s.length>5) return tentativa.getFullYear()+'-'+String(tentativa.getMonth()+1).padStart(2,'0')+'-01';
  return fallback;
}
function categoriaControladaEquivalente(texto){
  const chave = chaveNormalizada(texto||'');
  if(!chave) return false;
  const encontrada = CATEGORIAS_CONTROLADAS.find(c=>chaveNormalizada(c)===chave);
  if(encontrada) return true;
  if(/gas do povo/.test(chave)) return true;
  if(/(carga|vasilhame).*g[aá]s|g[aá]s.*(carga|vasilhame)|glp|botij[aã]o/.test(chave)) return true;
  if(/(carga|vasilhame).*[aá]gua|[aá]gua.*(carga|vasilhame)|safira|d ?fonte|dfonte/.test(chave)) return true;
  return false;
}

    const colCategoria = document.getElementById('map-prod-categoria').value;

      const nome = colNome ? (r[colNome]||'').trim() : '';
      const categoria = colCategoria ? (r[colCategoria]||'').trim() : '';
      if(!nome && !categoria) return;
      if(categoriaControladaEquivalente(nome) || categoriaControladaEquivalente(categoria)){
        candidatos.push({indice, nome, categoria});
      }
    });
    const box = document.getElementById('checklist-controlados-box');
    if(!box) return;
    if(candidatos.length===0){
      box.innerHTML = '<div class="hint">Nenhuma linha parecida com carga/vasilhame de gás, água ou Gás do Povo encontrada nessa planilha.</div>';
      return;
    }
    box.innerHTML = '<div class="hint" style="background:var(--amber-tint);border-radius:8px;padding:8px 10px;"><strong>'+candidatos.length+' linha(s) parecem ser gás/água</strong> — como isso já é controlado pelo estoque (aba Categorias Fixas), elas vêm <strong>desmarcadas por padrão e NÃO serão importadas</strong>. Se alguma for realmente um produto diferente (falso alarme), marque a caixa dela pra importar mesmo assim.</div>'+
      '<div class="cat-checklist" style="margin-top:8px;">'+candidatos.map(c=>
        '<label class="checkbox-item"><input type="checkbox" class="chk-importar-controlado" data-indice="'+c.indice+'"> Importar mesmo assim: <strong>'+(c.nome||'(sem nome)')+'</strong> <span class="hint">— '+(c.categoria||'sem tipo')+'</span></label>'
      ).join('')+'</div>';
  };
  document.getElementById('map-prod-nome').onchange = renderChecklistControlados;
  document.getElementById('map-prod-categoria').onchange = renderChecklistControlados;
  renderChecklistControlados();

  document.getElementById('btn-importar-csv-prod').onclick = async()=>{
    const colNome = document.getElementById('map-prod-nome').value;
    const colPreco = document.getElementById('map-prod-preco').value;
    const colCategoria = document.getElementById('map-prod-categoria').value;
    const colSituacao = document.getElementById('map-prod-situacao').value;
    const somenteAtivos = document.getElementById('chk-somente-ativos').checked;
    const permitidosControlados = new Set(Array.from(document.querySelectorAll('.chk-importar-controlado:checked')).map(el=>Number(el.dataset.indice)));
    const existentes = new Set(state.produtos.map(p=>(p.categoria+'|'+p.nome).toLowerCase()));
    const vistos = new Set();
    const novos = [];
    const categoriasNovas = new Set();
    let duplicados = 0, ignoradosInativos = 0, ignoradosControlados = 0;
    csvProdRows.forEach((r,indice)=>{
      if(!r[colNome]) return;
      if(somenteAtivos && colSituacao && r[colSituacao] && r[colSituacao].trim().toLowerCase()!=='ativo'){ ignoradosInativos++; return; }
      const nome = r[colNome].trim();
      let categoria = colCategoria ? (r[colCategoria]||'').trim() : '';
      if(!categoria) categoria = 'Mercearia';
      if((categoriaControladaEquivalente(categoria) || categoriaControladaEquivalente(nome)) && !permitidosControlados.has(indice)){
        ignoradosControlados++; return;
      }
      const precoTxt = colPreco ? (r[colPreco]||'0') : '0';
      const preco = Number(precoTxt.replace(/\./g,'').replace(',','.')) || 0;
      const chave = (categoria+'|'+nome).toLowerCase();
      if(existentes.has(chave) || vistos.has(chave)){ duplicados++; return; }
      vistos.add(chave);
      if(!state.categoriasProdutos.includes(categoria)) categoriasNovas.add(categoria);
      novos.push({id:uid(), nome, categoria, preco, ativo:true});
    });
    categoriasNovas.forEach(c=>state.categoriasProdutos.push(c));
    state.produtos = state.produtos.concat(novos);
    await save('produtos');
    if(categoriasNovas.size>0) await save('categoriasProdutos');
    csvProdRows=null; csvProdHeaders=null;
    renderAll();
    alert(novos.length+' produtos importados com sucesso.'+
      (duplicados>0 ? ' '+duplicados+' já existiam e foram ignorados.' : '')+
      (ignoradosInativos>0 ? ' '+ignoradosInativos+' estavam inativos e não foram importados.' : '')+
      (ignoradosControlados>0 ? ' '+ignoradosControlados+' eram itens de gás/água (já controlados pelo estoque) e foram ignorados, pra não duplicar.' : ''));
  };
}

    const colData = document.getElementById('map-fiado-data').value;
    const colDescricao = document.getElementById('map-fiado-descricao').value;

    const colSituacao = document.getElementById('map-fiado-situacao').value;

    const dataBaseEl = document.getElementById('input-fiado-data-base');

    if(!colNome || !colValor){ alert('Selecione ao menos as colunas de nome e valor.'); return; }
    let importadosFiado = 0, importadosCredito = 0, ignorados = 0, puladosPagos = 0;
    csvFiadoRows.forEach(r=>{
      if(colSituacao && soNaoPago){
        const sit = (r[colSituacao]||'').trim().toLowerCase();
        if(sit.indexOf('não')>-1 && sit.indexOf('pago')>-1){ /* não pago: segue */ }
        else if(sit==='pago'){ puladosPagos++; return; }
      }
      const nome = (r[colNome]||'').trim();
      const valorTxt = (colValor ? r[colValor] : '')||'0';
      const valor = Math.abs(Number(String(valorTxt).replace(/\./g,'').replace(',','.'))) || 0;
      if(!nome || valor<=0){ ignorados++; return; }
      const data = colData ? normalizarDataImportada(r[colData], dataBase) : dataBase;
      const descricao = colDescricao ? (r[colDescricao]||'').trim() : '';
      let tipo = tipoPadrao;
      if(colTipo && r[colTipo]){
        const t = r[colTipo].trim().toLowerCase();
        if(t.indexOf('cred')>-1 || t.indexOf('haver')>-1 || t.indexOf('abat')>-1) tipo = 'credito';
        else if(t.indexOf('fiad')>-1 || t.indexOf('deve')>-1) tipo = 'fiado';
      }
      if(tipo==='credito'){
        state.creditos.push({id:uid(), cliente:nome, valor:valor, data:data, obs: descricao || 'Importado — saldo anterior ao sistema'});
        importadosCredito++;
      } else {
        state.fiados.push({id:uid(), cliente:nome, valor:valor, data:data, descricao: descricao || 'Importado — saldo anterior ao sistema'});
        importadosFiado++;
      }
    });
    if(importadosFiado>0) await save('fiados');
    if(importadosCredito>0) await save('creditos');
    csvFiadoRows=null; csvFiadoHeaders=null;
    renderAll();
    alert((importadosFiado+importadosCredito)+' lançamento(s) importado(s) — '+importadosFiado+' de fiado e '+importadosCredito+' de crédito.'+(ignorados>0?' '+ignorados+' linha(s) ignoradas por falta de nome ou valor.':'')+(puladosPagos>0?' '+puladosPagos+' linha(s) já pagas foram puladas.':''));
  };

/* ---------- AUTENTICAÇÃO ---------- */
function showAuthMsg(text, ok){
  document.getElementById('auth-msg-wrap').innerHTML =
    '<div class="auth-msg '+(ok?'ok':'err')+'">'+text+'</div>';
}
function switchAuthTab(tab){
  document.querySelectorAll('[data-authtab]').forEach(b=>b.classList.toggle('active', b.dataset.authtab===tab));
  document.querySelectorAll('.auth-form').forEach(f=>f.classList.remove('active'));
  document.getElementById('form-'+tab).classList.add('active');
  document.getElementById('auth-msg-wrap').innerHTML = '';
}
const AUTH_DOMINIO_INTERNO = 'apptomgas.internal';
function normalizarUsuario(u){
  return (u||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9._-]/g,'');
}
function normalizarTelefoneAuth(t){
  return (t||'').replace(/\D/g,'');
}
function construirEmailAuth(tipo, valor){
  if(tipo==='telefone') return normalizarTelefoneAuth(valor)+'@'+AUTH_DOMINIO_INTERNO;
  if(tipo==='usuario') return normalizarUsuario(valor)+'@'+AUTH_DOMINIO_INTERNO;
  return (valor||'').trim().toLowerCase();
}
function detectarLoginEmail(identificador){
  const v = (identificador||'').trim();
  if(v.includes('@')) return v.toLowerCase();
  const soDigitos = v.replace(/\D/g,'');
  const naoDigitos = v.replace(/[0-9\s()+-]/g,'');
  if(soDigitos.length>=10 && soDigitos.length<=13 && naoDigitos.length===0){
    return normalizarTelefoneAuth(v)+'@'+AUTH_DOMINIO_INTERNO;
  }
  return normalizarUsuario(v)+'@'+AUTH_DOMINIO_INTERNO;
}
function attachAuthHandlers(){
  document.querySelectorAll('[data-authtab]').forEach(b=>b.onclick=()=>switchAuthTab(b.dataset.authtab));

  const cadastroTipo = document.getElementById('cadastro-tipo');
  if(cadastroTipo) cadastroTipo.onchange = ()=>{
    document.getElementById('cadastro-campo-email').style.display = cadastroTipo.value==='email' ? 'block' : 'none';
    document.getElementById('cadastro-campo-telefone').style.display = cadastroTipo.value==='telefone' ? 'block' : 'none';
    document.getElementById('cadastro-campo-usuario').style.display = cadastroTipo.value==='usuario' ? 'block' : 'none';
  };

  document.getElementById('form-login').onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const loginEmail = detectarLoginEmail(f.get('identificador'));
    const { error } = await supabaseClient.auth.signInWithPassword({ email:loginEmail, password:f.get('senha') });
    if(error){ showAuthMsg(error.message==='Invalid login credentials' ? 'E-mail/celular/usuário ou senha incorretos.' : error.message, false); return; }
    await afterLogin();
  };

  document.getElementById('form-cadastro').onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    if(f.get('senha') !== f.get('senha2')){ showAuthMsg('As senhas não conferem.', false); return; }
    const tipo = document.getElementById('cadastro-tipo').value;
    const valorCampo = tipo==='email' ? document.getElementById('cadastro-email').value :
      tipo==='telefone' ? document.getElementById('cadastro-telefone').value :
      document.getElementById('cadastro-usuario').value;
    if(!valorCampo || !valorCampo.trim()){
      showAuthMsg(tipo==='email' ? 'Informe o e-mail.' : tipo==='telefone' ? 'Informe o celular.' : 'Informe o usuário.', false);
      return;
    }
    const loginEmail = construirEmailAuth(tipo, valorCampo);
    const { error } = await supabaseClient.auth.signUp({
      email:loginEmail, password:f.get('senha'),
      options: { data: {
        nome: f.get('nome'),
        tipo_login: tipo,
        email_real: tipo==='email' ? valorCampo.trim() : '',
        telefone: tipo==='telefone' ? normalizarTelefoneAuth(valorCampo) : '',
        usuario: tipo==='usuario' ? normalizarUsuario(valorCampo) : ''
      } }
    });
    if(error){ showAuthMsg(error.message, false); return; }
    if(tipo==='email'){
      showAuthMsg('Conta criada! Verifique seu e-mail para confirmar antes de entrar.', true);
    } else {
      showAuthMsg('Conta criada! Já pode entrar usando o '+(tipo==='telefone'?'celular':'usuário')+' e a senha cadastrados.', true);
    }
    switchAuthTab('login');
  };

  document.getElementById('form-recuperar').onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const { error } = await supabaseClient.auth.resetPasswordForEmail(f.get('email'), { redirectTo: window.location.href });
    if(error){ showAuthMsg(error.message, false); return; }
    showAuthMsg('Enviamos um link de recuperação para o seu e-mail.', true);
  };
}

/* ---------- PWA / NOTIFICAÇÕES ---------- */
function registerServiceWorker(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Erro ao registrar service worker', e));
  }
}
function statusPermissaoNotificacao(){
  if(!('Notification' in window)) return 'indisponivel';
  return Notification.permission;
}
async function pedirPermissaoNotificacao(){
  if(!('Notification' in window)){ alert('Este navegador não suporta notificações.'); return; }
  const perm = await Notification.requestPermission();
  renderAll();
  if(perm==='granted'){
    notificarLocal('Notificações ativadas', 'Você vai receber avisos de novos agendamentos e entregas por aqui.');
    await inscreverPush();
  }
}
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
async function inscreverPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    await supabaseClient.from('push_subscriptions').upsert({
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }, { onConflict: 'endpoint' });
  }catch(e){ console.error('Erro ao se inscrever para notificações push', e); }
}
async function enviarPushServidor(titulo, corpo){
  try{
    await fetch(SUPABASE_URL + '/functions/v1/swift-handler', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ title: titulo, body: corpo })
    });
  }catch(e){ console.error('Erro ao enviar notificação push', e); }
}
function atualizarBadgeApp(){
  if(!('setAppBadge' in navigator)) return;
  const pendentesAg = state.agendamentos.filter(a=>a.status==='pendente').length;
  const pendentesVenda = state.vendas.filter(v=>v.entrega_hora && v.entrega_status!=='entregue').length;
  const pendentes = pendentesAg + pendentesVenda;
  try{
    if(pendentes>0) navigator.setAppBadge(pendentes).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }catch(e){}
}
function notificarLocal(titulo, corpo){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const options = { body: corpo, icon: 'icon-192-v2.png', badge: 'icon-192-v2.png', vibrate:[200,100,200] };
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration().then(reg=>{
      if(reg && reg.showNotification){ reg.showNotification(titulo, options); }
      else { new Notification(titulo, options); }
    }).catch(()=>{ try{ new Notification(titulo, options); }catch(e){ console.error('Notificação falhou', e); } });
  } else {
    try{ new Notification(titulo, options); }catch(e){ console.error('Notificação falhou', e); }
  }
}
function iniciarNotificacoesRealtime(){
  try{
    supabaseClient.channel('app_data_mudancas')
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_data', filter:'chave=eq.agendamentos' }, (payload)=>{
        const novoValor = payload.new && payload.new.valor ? payload.new.valor : [];
        const idsAntigos = new Set(state.agendamentos.map(a=>a.id));
        const novos = novoValor.filter(a=>!idsAntigos.has(a.id));
        novos.forEach(a=>{
          notificarLocal('Novo agendamento de entrega', (a.cliente||'Cliente')+' — '+(a.hora||'')+(a.data?' ('+fmtDate(a.data)+')':''));
        });
        state.agendamentos = novoValor;
        atualizarBadgeApp();
        if(currentTab==='agendamentos' || currentTab==='dashboard') renderAll();
      })
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_data', filter:'chave=eq.vendas' }, (payload)=>{
        const novoValor = payload.new && payload.new.valor ? payload.new.valor : [];
        const idsAntigos = new Set(state.vendas.map(v=>v.id));
        const novos = novoValor.filter(v=>!idsAntigos.has(v.id) && v.entrega_hora);
        novos.forEach(v=>{
          notificarLocal('Nova entrega registrada', (v.cliente||'Cliente')+' — '+v.produto+' às '+v.entrega_hora);
        });
        state.vendas = novoValor;
        if(currentTab==='vendas' || currentTab==='dashboard') renderAll();
      })
      .subscribe();
  }catch(e){ console.error('Erro ao iniciar notificações em tempo real', e); }
}

/* ---------- QTY STEPPER (setinhas +/- de quantidade) ---------- */
document.addEventListener('click', function(e){
  const btn = e.target.closest('.qty-btn');
  if(!btn) return;
  const wrap = btn.closest('.qty-stepper');
  const input = wrap ? wrap.querySelector('input[type=number]') : null;
  if(!input) return;
  const min = input.min!=='' ? Number(input.min) : -Infinity;
  const step = Number(input.step)||1;
  let val = Number(input.value)||0;
  val = btn.classList.contains('qty-plus') ? val+step : val-step;
  if(val<min) val = min;
  input.value = val;
  input.dispatchEvent(new Event('input', {bubbles:true}));
});

    '<div class="ag-item" style="border-left:4px solid '+(corPrior[ev.prioridade]||'#999')+';">'+
    '<div class="ag-titulo">'+ev.titulo+' <span style="font-weight:400;font-size:11px;">('+ev.status+')</span></div>'+
    '<div class="ag-meta">📅 '+fmtDate(ev.data)+' às '+ev.hora+' · '+ev.categoria+' · '+ev.prioridade+(ev.som?' · 🔔':'')+'</div>'+
    (ev.obs?'<div class="ag-meta">'+ev.obs+'</div>':'')+
    '<div class="ag-acoes"><button data-ag-editar="'+ev.id+'">✎ editar</button><button data-ag-excluir="'+ev.id+'">🗑 excluir</button></div>'+
    '</div>'
  ).join('');
}
function initAgenda(){
  const fab = document.getElementById('agenda-fab'), overlay = document.getElementById('agenda-overlay'),
    drawer = document.getElementById('agenda-drawer'), fechar = document.getElementById('agenda-fechar'),
    form = document.getElementById('form-agenda-evento'), cancelarEd = document.getElementById('agenda-cancelar-edicao');
  function abrir(){ drawer.classList.add('open'); overlay.classList.add('open'); renderAgendaLista(); }
  function fecharDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }
  if(fab) fab.onclick = abrir;
  if(fechar) fechar.onclick = fecharDrawer;
  if(overlay) overlay.onclick = fecharDrawer;
  if(cancelarEd) cancelarEd.onclick = ()=>{ form.reset(); form.id.value=''; cancelarEd.style.display='none'; };
  if(form) form.onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(form);
    const id = f.get('id');
    const dados = {
      titulo:f.get('titulo'), data:f.get('data'), hora:f.get('hora'), categoria:f.get('categoria'),
      prioridade:f.get('prioridade'), lembrete:f.get('lembrete'), status:f.get('status'),
      som: form.som.checked, obs:f.get('obs')||''
    };
    if(!state.agendaEventos) state.agendaEventos = [];
    if(id){
      const idx = state.agendaEventos.findIndex(x=>x.id===id);
      if(idx>-1) state.agendaEventos[idx] = Object.assign(state.agendaEventos[idx], dados);
    } else {
      dados.id = uid(); dados.avisado = {};
      state.agendaEventos.push(dados);
    }
    await save('agendaEventos');
    form.reset(); form.id.value=''; if(cancelarEd) cancelarEd.style.display='none';
    renderAgendaLista();
  };
  document.getElementById('agenda-lista').addEventListener('click', async(e)=>{
    const btnEd = e.target.closest('[data-ag-editar]'), btnEx = e.target.closest('[data-ag-excluir]');
    if(btnEd){
      const ev = state.agendaEventos.find(x=>x.id===btnEd.dataset.agEditar);
      if(!ev) return;
      form.id.value = ev.id; form.titulo.value = ev.titulo; form.data.value = ev.data; form.hora.value = ev.hora;
      form.categoria.value = ev.categoria; form.prioridade.value = ev.prioridade; form.lembrete.value = ev.lembrete;
      form.status.value = ev.status; form.som.checked = !!ev.som; form.obs.value = ev.obs||'';
      if(cancelarEd) cancelarEd.style.display='inline-block';
    }
    if(btnEx){
      if(!confirm('Excluir esse evento?')) return;
      state.agendaEventos = state.agendaEventos.filter(x=>x.id!==btnEx.dataset.agExcluir);
      await save('agendaEventos');
      renderAgendaLista();
    }
  });
  // Verifica lembretes a cada minuto e toca som se estiver na hora
  setInterval(()=>{
    const agora = new Date();
    (state.agendaEventos||[]).forEach(ev=>{
      if(ev.status!=='Pendente' || !ev.lembrete || Number(ev.lembrete)<=0) return;
      const alvo = new Date(ev.data+'T'+ev.hora+':00');
      const minsAntes = Number(ev.lembrete);
      const diffMin = (alvo - agora)/60000;
      if(diffMin<=minsAntes && diffMin>minsAntes-1){
        if(!ev.avisado) ev.avisado = {};
        if(ev.avisado[minsAntes]) return;
        ev.avisado[minsAntes] = true;
        save('agendaEventos');
        if(ev.som){try{const C=window.AudioContext||window.webkitAudioContext;if(C){const ac=new C(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.45);}}catch(err){}}
        alert('🔔 Lembrete: '+ev.titulo+' às '+ev.hora);
      }
    });
  }, 60000);
}

async function iniciarConfirmacaoEntregaPublica(agendamentoId){
  document.body.innerHTML = '<div id="conf-entrega" style="max-width:480px;margin:30px auto;padding:20px;font-family:Arial,sans-serif;">Carregando...</div>';
  const wrap = document.getElementById('conf-entrega');
  let agendamentos, clientes, anexos;
  try{
    const { data, error } = await supabaseClient.from('app_data').select('chave,valor').in('chave',['agendamentos','clientes','anexosEntrega']);
    if(error) throw error;
    const porChave = {}; (data||[]).forEach(r=>porChave[r.chave]=r.valor);
    agendamentos = porChave.agendamentos || [];
    clientes = porChave.clientes || [];
    anexos = porChave.anexosEntrega || [];
  }catch(e){
    wrap.innerHTML = '<h2>Erro ao carregar</h2><p>Verifique sua internet e tente abrir o link de novo.</p>';
    return;
  }
  const ag = agendamentos.find(a=>a.id===agendamentoId);
  if(!ag){ wrap.innerHTML = '<h2>Entrega não encontrada</h2><p>Esse link pode estar errado ou a entrega já foi removida.</p>'; return; }
  const cliente = clientes.find(c=>c.nome===ag.cliente);
  const endereco = cliente ? ((cliente.endereco||'')+(cliente.complemento?(' - '+cliente.complemento):'')) : '';
  const statusPagto = ag.pago ? '✅ Já pago' : (ag.pagamento==='Marcou/Fiado' ? '📒 Fiado (não cobrar agora)' : '💰 Cobrar na entrega'+(ag.valor?': '+fmtMoney(ag.valor):''));
  function render(){
    const jaConcluido = ag.status==='concluido';
    const anexosDele = anexos.filter(a=>a.agendamentoId===agendamentoId);
    wrap.innerHTML = '<h2>🚚 Confirmar entrega</h2>'+
      '<div style="background:#f5f5f5;border-radius:12px;padding:16px;margin-bottom:16px;line-height:1.6;">'+
      '<div><strong>🙍 Cliente:</strong> '+escapeHtmlCampanha(ag.cliente||'')+'</div>'+
      (endereco?'<div><strong>📍 Endereço:</strong> '+escapeHtmlCampanha(endereco)+'</div>':'')+
      '<div><strong>📦 Produto:</strong> '+escapeHtmlCampanha(ag.produto_nota||'')+'</div>'+
      '<div style="margin-top:6px;font-weight:bold;">'+statusPagto+'</div>'+
      '</div>'+
      (jaConcluido ? '<div style="color:#188038;font-weight:bold;margin-bottom:14px;">✅ Entrega já marcada como concluída.</div>' :
        '<button id="btn-marcar-entregue" style="width:100%;padding:14px;font-size:16px;background:#25D366;color:#fff;border:none;border-radius:10px;margin-bottom:14px;">✅ Marcar como entregue</button>')+
      '<div style="margin-top:10px;"><label style="display:block;margin-bottom:6px;font-weight:bold;">📷 Tirar foto do comprovante</label>'+
      '<input type="file" id="input-foto-comprovante" accept="image/*" capture="environment" style="width:100%;"></div>'+
      (anexosDele.length>0 ? '<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;">'+
        anexosDele.map(a=>'<img src="'+a.dataUrl+'" style="width:90px;height:90px;object-fit:cover;border-radius:8px;">').join('')+
        '</div>' : '')+
      '<div id="msg-conf" style="margin-top:12px;font-weight:bold;color:#188038;"></div>';
    const btn = document.getElementById('btn-marcar-entregue');
    if(btn) btn.onclick = async()=>{
      btn.disabled = true; btn.textContent = 'Salvando...';
      ag.status = 'concluido';
      const { error:err2 } = await supabaseClient.from('app_data').upsert({chave:'agendamentos', valor:agendamentos, atualizado_em:new Date().toISOString()},{onConflict:'chave'});
      if(err2){ ag.status = 'pendente'; alert('Erro ao salvar, tenta de novo.'); btn.disabled=false; btn.textContent='✅ Marcar como entregue'; return; }
      render();
      document.getElementById('msg-conf').textContent = '✅ Entrega marcada como concluída!';
    };
    const inputFoto = document.getElementById('input-foto-comprovante');
    if(inputFoto) inputFoto.onchange = ()=>{
      const file = inputFoto.files[0];
      if(!file) return;
      if(file.size > 6*1024*1024){ alert('Foto muito grande. Tenta uma foto menor.'); return; }
      const r = new FileReader();
      r.onload = async(ev)=>{
        anexos.push({id:uid(), tipo:'foto', dataUrl:ev.target.result, cliente:ag.cliente||'', agendamentoId, paradaId:'', data: ag.data||todayStr(), entregadorId: ag.entregadorId||'', obs:'Comprovante de entrega', criadoEm:Date.now()});
        const { error:err3 } = await supabaseClient.from('app_data').upsert({chave:'anexosEntrega', valor:anexos, atualizado_em:new Date().toISOString()},{onConflict:'chave'});
        if(err3){ alert('Erro ao enviar a foto, tenta de novo.'); return; }
        render();
        document.getElementById('msg-conf').textContent = '📷 Foto de comprovante enviada!';
      };
      r.readAsDataURL(file);
    };
  }
  render();
}
async function init(){
  const paramsUrl = new URLSearchParams(location.search);
  const entregaId = paramsUrl.get('entrega');
  if(entregaId){ await iniciarConfirmacaoEntregaPublica(entregaId); return; }
  attachAuthHandlers();
  attachLogoInput();
  registerServiceWorker();
  const { data:{ session } } = await supabaseClient.auth.getSession();
  if(session){
    await afterLogin();
  } else {
    document.getElementById('auth-screen').style.display = 'flex';
  }
}
init();
